<!DOCTYPE html><html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ใบประกาศนียบัตร — ZENITH</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="_shared.css"><script src="assets/js/theme.js"></script><script src="assets/js/sidebar.js"></script>
<style>
/* loading spinner */
.spin { animation: spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* certificate card */
.cert-card {
  position: relative; overflow: hidden;
  background: linear-gradient(135deg,#0e0820 0%,#150b2e 50%,#0a0614 100%);
  border: 1px solid rgba(168,85,247,.28);
  border-radius: var(--r3);
  padding: 3rem;
  text-align: center;
  margin-bottom: 24px;
}
.cert-card::before {
  content:''; position:absolute; inset:0; pointer-events:none;
  background:
    radial-gradient(ellipse at 20% 0%,  rgba(168,85,247,.12), transparent 55%),
    radial-gradient(ellipse at 80% 100%,rgba(124,58,237,.07),  transparent 55%);
}
.cert-glow {
  position:absolute; top:-80px; left:50%; transform:translateX(-50%);
  width:400px; height:400px; border-radius:50%;
  background:radial-gradient(circle,rgba(168,85,247,.10) 0%,transparent 65%);
  pointer-events:none;
}
.cert-corner {
  position:absolute; width:48px; height:48px;
  border-color: rgba(168,85,247,.40); border-style:solid;
}
.cert-corner-tl { top:16px; left:16px;  border-width:2px 0 0 2px; border-radius:4px 0 0 0; }
.cert-corner-tr { top:16px; right:16px; border-width:2px 2px 0 0; border-radius:0 4px 0 0; }
.cert-corner-bl { bottom:16px; left:16px;  border-width:0 0 2px 2px; border-radius:0 0 0 4px; }
.cert-corner-br { bottom:16px; right:16px; border-width:0 2px 2px 0; border-radius:0 0 4px 0; }
.cert-inner { position:relative; z-index:1; }
.cert-label {
  font-size:10px; font-weight:700; letter-spacing:.25em;
  text-transform:uppercase; color:var(--accent); margin-bottom:4px;
}
.cert-type {
  font-size:10px; font-weight:600; letter-spacing:.15em;
  text-transform:uppercase; color:var(--text3); margin-bottom:20px;
}
.cert-divider {
  height:1px; margin:20px auto; max-width:240px;
  background:linear-gradient(90deg,transparent,rgba(168,85,247,.5),rgba(124,58,237,.3),transparent);
}
.cert-to { font-size:11px; color:var(--text3); letter-spacing:.1em; text-transform:uppercase; margin-bottom:8px; }
.cert-name {
  font-family:'Playfair Display',serif; font-size:2.4rem; font-weight:700;
  color:var(--text); line-height:1.15; margin-bottom:20px;
}
.cert-desc { font-size:13px; color:var(--text2); margin-bottom:12px; }
.cert-course-chip {
  display:inline-flex; align-items:center; gap:10px;
  padding:10px 22px; border-radius:12px; margin-bottom:16px;
}
.cert-count { font-size:12px; color:var(--text3); margin-bottom:24px; }
.cert-footer {
  display:flex; align-items:flex-end; justify-content:space-between;
  gap:16px; flex-wrap:wrap;
}
.cert-sig { text-align:left; }
.cert-sig-name { font-size:14px; font-weight:800; color:var(--text); margin-bottom:2px; }
.cert-sig-sub { font-size:10px; color:var(--text3); letter-spacing:.05em; text-transform:uppercase; }
.cert-date { text-align:center; }
.cert-date-val { font-size:12px; font-weight:700; color:var(--text); margin-bottom:2px; }
.cert-school { text-align:right; }

/* no cert / progress section */
.no-cert {
  background:var(--bg2); border:1px solid var(--border);
  border-radius:var(--r3); padding:3rem; text-align:center;
}
.no-cert-icon { font-size:56px; margin-bottom:16px; line-height:1; }
.no-cert-title { font-size:20px; font-weight:800; margin-bottom:8px; }
.no-cert-sub { font-size:13px; color:var(--text2); line-height:1.65; margin-bottom:24px; }

.prog-badge {
  background:var(--bg3); border:1px solid var(--border);
  border-radius:10px; padding:12px; display:flex; align-items:center; gap:10px;
}
.prog-badge.done {
  background:var(--accent-g); border-color:var(--accent-border);
}

/* layout helpers */
.sb-chevron { color:var(--text3); font-size:13px; margin-left:auto; }
.loading-wrap { display:flex; align-items:center; justify-content:center; min-height:60vh; }
.loading-inner { text-align:center; }
.loading-icon { font-size:32px; color:var(--accent); }
.loading-label { font-size:12px; color:var(--text3); margin-top:12px; letter-spacing:.05em; text-transform:uppercase; }
.card-mt { margin-top:24px; }
.card-hdr { display:flex; align-items:center; gap:8px; }
.card-hdr-icon { color:var(--accent); font-size:16px; }
.badge-grid-gap { gap:10px; }

/* print */
@media print {
  .sidebar, .topbar, #printBtn { display:none!important; }
  .main { margin-left:0!important; }
  .cert-card { border:1.5px solid rgba(168,85,247,.4)!important; break-inside:avoid; }
}
</style>
</head>
<body>
<div class="layout">

<!-- ── SIDEBAR ─────────────────────────────────── -->
<aside class="sidebar">
  <a href="dashboard.html" class="sidebar-logo">
    <div class="logo-mark">Z</div>
    ZENITH
  </a>
  <div class="nav-group">
    <div class="nav-group-label">เมนูหลัก</div>
    <a class="nav-link" href="dashboard.html"><i class="ti ti-home"></i> Dashboard</a>
    <a class="nav-link" href="index.html"><i class="ti ti-books"></i> คอร์สเรียน</a>
    <a class="nav-link" href="profile.html"><i class="ti ti-user"></i> โปรไฟล์</a>
    <a class="nav-link active" href="certificate.html"><i class="ti ti-certificate"></i> ใบประกาศ</a>
    <div class="nav-divider"></div>
    <a class="nav-link" href="settings.html"><i class="ti ti-settings"></i> ตั้งค่า</a>
  </div>
  <div class="sidebar-bottom">
    <a class="user-pill" href="profile.html">
      <div class="avatar" id="sidebar-avatar">?</div>
      <div class="user-info">
        <div class="user-name" id="sidebar-name">—</div>
        <div class="user-pts"><span id="sidebar-xp">0</span> XP</div>
      </div>
      <i class="ti ti-chevron-right sb-chevron"></i>
    </a>
  </div>
</aside>

<!-- ── MAIN ──────────────────────────────────── -->
<main class="main">
  <div class="topbar">
    <div class="topbar-title">ใบประกาศนียบัตร</div>
    <div class="topbar-right">
      <button id="printBtn" type="button" onclick="window.print()" class="btn btn-sm btn-ghost hidden">
        <i class="ti ti-printer"></i> พิมพ์ / บันทึก PDF
      </button>
      <a href="index.html" class="btn btn-sm btn-ghost">
        <i class="ti ti-books"></i> คอร์สเรียน
      </a>
    </div>
  </div>

  <div class="page-body">

    <!-- Loading -->
    <div id="loadingState" class="loading-wrap">
      <div class="loading-inner">
        <i class="ti ti-loader-2 spin loading-icon"></i>
        <div class="loading-label">กำลังโหลด...</div>
      </div>
    </div>

    <!-- No cert -->
    <div id="noCertSection" class="hidden">
      <div class="no-cert anim-up">
        <div class="no-cert-icon">🎓</div>
        <div class="no-cert-title">ยังไม่มีใบประกาศ</div>
        <div class="no-cert-sub">เรียนจบอย่างน้อย 1 คอร์สก่อนนะ<br>แล้วใบประกาศจะปรากฏที่นี่</div>
        <a href="index.html" class="btn btn-green btn-lg">
          <i class="ti ti-books"></i> ไปเรียนต่อ
        </a>
      </div>
    </div>

    <!-- Certificates -->
    <div id="certSection" class="hidden anim-up"></div>

    <!-- Progress badges -->
    <div id="progressSection" class="hidden anim-up delay-2">
      <div class="card card-mt">
        <div class="card-title">
          <div class="card-hdr">
            <i class="ti ti-chart-bar card-hdr-icon"></i>
            วิชาทั้งหมด
          </div>
        </div>
        <div id="badgeGrid" class="g3 badge-grid-gap"></div>
      </div>
    </div>

  </div>
</main>
</div>

<script type="module">
import { auth } from './assets/js/firebase.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const COURSES = [
  { key: 'python',     label: 'Python',       total: 12, color: '#00E5A0', emoji: '🐍' },
  { key: 'javascript', label: 'JavaScript',   total: 10, color: '#FFB340', emoji: '⚡' },
  { key: 'cpp',        label: 'C++',          total: 10, color: '#4D9EFF', emoji: '⚙️' },
  { key: 'java',       label: 'Java',         total: 10, color: '#FFB340', emoji: '☕' },
  { key: 'html',       label: 'HTML',         total: 10, color: '#FF6EA8', emoji: '🏗️' },
  { key: 'css',        label: 'CSS',          total: 10, color: '#4D9EFF', emoji: '🎨' },
];

function formatDate() {
  return new Date().toLocaleDateString('th-TH', { day:'numeric', month:'long', year:'numeric' });
}

function buildCertCard(course, username) {
  return `
  <div class="cert-card">
    <div class="cert-glow"></div>
    <div class="cert-corner cert-corner-tl"></div>
    <div class="cert-corner cert-corner-tr"></div>
    <div class="cert-corner cert-corner-bl"></div>
    <div class="cert-corner cert-corner-br"></div>
    <div class="cert-inner">
      <div class="cert-label">ZENITH · Classroom</div>
      <div class="cert-type">Certificate of Completion</div>
      <div class="cert-divider"></div>
      <div class="cert-to">มอบให้แก่</div>
      <div class="cert-name">${username}</div>
      <div class="cert-desc">ได้ศึกษาและผ่านบทเรียนทั้งหมดของวิชา</div>
      <div class="cert-course-chip" style="background:${course.color}18;border:1px solid ${course.color}40">
        <span style="font-size:28px">${course.emoji}</span>
        <span style="font-size:20px;font-weight:800;color:${course.color}">${course.label}</span>
      </div>
      <div class="cert-count">ครบ ${course.total} บทเรียน · ${course.total} Quiz</div>
      <div class="cert-divider"></div>
      <div class="cert-footer">
        <div class="cert-sig">
          <div class="cert-sig-name">ZENITH.</div>
          <div class="cert-sig-sub">Zenith Classroom</div>
        </div>
        <div class="cert-date">
          <div class="cert-date-val">${formatDate()}</div>
          <div class="cert-sig-sub">วันที่ออกใบประกาศ</div>
        </div>
        <div class="cert-school">
          <div class="cert-sig-name">วิทยาลัยเทคนิคลำพูน</div>
          <div class="cert-sig-sub">Senior Project 2026</div>
        </div>
      </div>
    </div>
  </div>`;
}

onAuthStateChanged(auth, (user) => {
  if (!user) { window.location.href = 'login.html'; return; }

  document.getElementById('loadingState').style.display = 'none';

  const username        = user.displayName || user.email.split('@')[0];
  const certSection     = document.getElementById('certSection');
  const noCertSection   = document.getElementById('noCertSection');
  const progressSection = document.getElementById('progressSection');
  const badgeGrid       = document.getElementById('badgeGrid');

  // sidebar
  const av = document.getElementById('sidebar-avatar');
  const nm = document.getElementById('sidebar-name');
  if (av) av.textContent = username.charAt(0).toUpperCase();
  if (nm) nm.textContent = username;

  let completedCourses = [];

  COURSES.forEach(course => {
    const unlocked = parseInt(localStorage.getItem(`zenith_progress_${course.key}`) || '1');
    const done = Math.max(0, unlocked - 1);
    const completed = done >= course.total;

    if (completed) completedCourses.push(course);

    const badge = document.createElement('div');
    badge.className = `prog-badge${completed ? ' done' : ''}`;
    badge.innerHTML = `
      <span style="font-size:22px">${course.emoji}</span>
      <div style="min-width:0">
        <div style="font-size:13px;font-weight:700;color:${completed ? course.color : 'var(--text)'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${course.label}</div>
        <div style="font-size:11px;font-weight:600;color:${completed ? course.color : 'var(--text3)'}">${completed ? '✓ จบแล้ว' : `${done}/${course.total} บท`}</div>
      </div>`;
    badgeGrid.appendChild(badge);
  });

  progressSection.classList.remove('hidden');

  if (completedCourses.length === 0) {
    noCertSection.classList.remove('hidden');
  } else {
    certSection.classList.remove('hidden');
    document.getElementById('printBtn').classList.remove('hidden');
    completedCourses.forEach(c => { certSection.innerHTML += buildCertCard(c, username); });
  }
});
</script>
</body></html>
