    75%{transform:translateX(4px)}

.fade-up{
    animation:fade .4s ease;

@keyframes fade{
    from{

    to{

    100% { background-position:  600px 0; }

<script type="module">
    import { auth } from './assets/js/firebase.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { syncFromFirestore, saveToFirestore, saveQuizScore } from './assets/js/progress.js';

    function showCloudIndicator(msg, ok = true) {
        const el = document.getElementById('cloudSaveIndicator');
        if (!el) return;
        el.textContent = msg;
        el.style.color   = ok ? '#2dd4bf' : '#ef4444';
        el.style.opacity = '1';
        setTimeout(() => { el.style.opacity = '0'; }, 3500);
    }

    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            window.location.href = 'login.html';
            return;
        }
        await syncFromFirestore();

        // Wrap saveToFirestore เพื่อแสดงสถานะ save บน UI
        window._zenithSaveProgress = async (courseKey, level) => {
            const ok = await saveToFirestore(courseKey, level);
            showCloudIndicator(ok ? '☁ บันทึกลง Cloud แล้ว' : '⚠ บันทึกไม่สำเร็จ ลองใหม่', ok);
        };

        // Wrap saveQuizScore เช่นกัน
        window._zenithSaveQuizScore = async (courseKey, lessonId) => {
            await saveQuizScore(courseKey, lessonId);
        };
    });
</script>

<script>

function toggleDrawer() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('drawerOverlay');
    if (!sidebar || !overlay) return;
    const isOpen = sidebar.classList.toggle('drawer-open');
    overlay.classList.toggle('visible', isOpen);
    document.body.style.overflow = isOpen ? 'hidden' : '';
}

function closeDrawer() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('drawerOverlay');
    if (sidebar) sidebar.classList.remove('drawer-open');
    if (overlay) overlay.classList.remove('visible');
    document.body.style.overflow = '';
}

const params = new URLSearchParams(window.location.search);

window.courseType = params.get('course') || 'python';

currentLessonId = parseInt(params.get('id') || '1');

document.getElementById('backBtn').href = 'index.html';

<script>
(function () {
    var _cm = null;
    var _pyodide = null;
    var _editorLang = 'javascript';

    var langModeMap = {
        python: 'python',
        javascript: 'javascript',
        js: 'javascript',
        html: 'htmlmixed',
        css: 'css',
        php: 'php',
        sql: 'text/x-sql',
        cpp: 'text/x-c++src',
        java: 'text/x-java'
    };

    window.initCodeEditor = function (code, courseType) {
        var section = document.getElementById('editorSection');
        if (!section) return;

        if (!code) {
            section.classList.add('hidden');
            return;
        }

        section.classList.remove('hidden');
        _editorLang = courseType || 'javascript';

        var badge = document.getElementById('editorLangBadge');
        var labelMap = { cpp: 'C++', java: 'Java', javascript: 'JavaScript', python: 'Python', html: 'HTML', css: 'CSS', php: 'PHP', sql: 'SQL' };
        if (badge) badge.textContent = labelMap[_editorLang] || _editorLang;

        var output = document.getElementById('codeOutput');
        if (output) output.innerHTML = '<span class="output-placeholder">// ผลลัพธ์จะแสดงที่นี่</span>';

        var editorEl = document.getElementById('codeEditorEl');
        if (!editorEl) return;

        var cmMode = langModeMap[_editorLang] || 'javascript';

        if (_cm) {
            _cm.setValue(code);
            _cm.setOption('mode', cmMode);
        } else if (typeof CodeMirror !== 'undefined') {
            _cm = CodeMirror(editorEl, {
                value: code,
                mode: cmMode,
                lineNumbers: true,
                indentUnit: 4,
                tabSize: 4,
                indentWithTabs: false,
                lineWrapping: true,
                extraKeys: { Tab: function(cm) { cm.replaceSelection('    '); } }
            });
        } else {
            editorEl.innerHTML = '';
            var ta = document.createElement('textarea');
            ta.value = code;
            ta.className = 'editor-fallback-ta';
            editorEl.appendChild(ta);
        }
    };

    window.runCode = function () {
        var code = '';
        if (_cm) {
            code = _cm.getValue();
        } else {
            var ta = document.querySelector('#codeEditorEl textarea');
            if (ta) code = ta.value;
        }
        if (!code.trim()) return;

        var output = document.getElementById('codeOutput');
        if (output) output.innerHTML = '<span class="out-accent">▶ กำลังประมวลผล...</span>';

        if (_editorLang === 'python') {
            _runPython(code, output);
        } else if (_editorLang === 'html' || _editorLang === 'htmlmixed') {
            _runHTML(code, output);
        } else if (_editorLang === 'sql' || _editorLang === 'php') {
            if (output) output.innerHTML = '<span class="out-warn">⚠ ' + _editorLang.toUpperCase() + ' ไม่รองรับการรันในเบราเซอร์</span>\n<span class="out-dim">แต่คุณสามารถแก้ไขและศึกษาโค้ดได้</span>';
        } else if (_editorLang === 'cpp' || _editorLang === 'java') {
            if (output) output.innerHTML = '<span class="out-warn">⚠ ' + (_editorLang === 'cpp' ? 'C++' : 'Java') + ' ต้องใช้ compiler รัน</span>\n<span class="out-dim">ศึกษาโค้ดได้เลย — ลองรันบน IDE หรือ online compiler เช่น replit.com</span>';
        } else {
            _runJS(code, output);
        }
    };

    function _runJS(code, output) {
        var logs = [];
        var _cl = console.log, _ce = console.error, _cw = console.warn;
        console.log   = function() { logs.push(Array.from(arguments).map(_fmt).join(' ')); };
        console.error = function() { logs.push('<span class="out-error">❌ ' + Array.from(arguments).map(_fmt).join(' ') + '</span>'); };
        console.warn  = function() { logs.push('<span class="out-warn">⚠ '  + Array.from(arguments).map(_fmt).join(' ') + '</span>'); };
        try {
            new Function(code)();
            if (output) output.innerHTML = logs.length ? logs.join('\n') : '<span class="output-placeholder">// ไม่มี output</span>';
        } catch (e) {
            if (output) output.innerHTML = '<span class="out-error">❌ ' + _esc(e.message) + '</span>';
        } finally {
            console.log = _cl; console.error = _ce; console.warn = _cw;
        }
    }

    function _runHTML(code, output) {
        if (!output) return;
        var fr = document.createElement('iframe');
        fr.className = 'html-preview-frame';
        fr.setAttribute('sandbox', 'allow-scripts');
        output.innerHTML = '';
        output.appendChild(fr);
        fr.srcdoc = code;
    }

    function _runPython(code, output) {
        Promise.resolve().then(function () {
            if (!_pyodide) {
                if (output) output.innerHTML = '<span class="out-accent">⏳ โหลด Python runtime (~8MB) ครั้งแรก...</span>';
                return _loadScript('https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js')
                    .then(function () { return window.loadPyodide(); })
                    .then(function (py) { _pyodide = py; });
            }
        }).then(function () {
            return _pyodide.runPythonAsync('import sys, io as _io\n_z=_io.StringIO()\nsys.stdout=_z\nsys.stderr=_z\n');
        }).then(function () {
            return _pyodide.runPythonAsync(code);
        }).then(function () {
            var out = _pyodide.runPython('_z.getvalue()');
            if (output) output.innerHTML = out ? _esc(out) : '<span class="output-placeholder">// ไม่มี output</span>';
        }).catch(function (e) {
            if (output) output.innerHTML = '<span class="out-error">❌ ' + _esc(e.message) + '</span>';
        });
    }

    function _loadScript(src) {
        return new Promise(function (res, rej) {
            var s = document.createElement('script');
            s.src = src; s.onload = res; s.onerror = rej;
            document.head.appendChild(s);
        });
    }

    function _fmt(v) { return typeof v === 'object' ? JSON.stringify(v, null, 2) : String(v); }
    function _esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
})();
</script>
