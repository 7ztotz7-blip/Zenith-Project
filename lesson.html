<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zenith | Classroom</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

body{
    font-family:'Kanit',sans-serif;
    background:#050505;
    color:white;
    overflow-x:hidden;
}

/* VIDEO */

#bg-video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-2;
    opacity:.18;
    filter:brightness(.45);
}

.video-overlay{
    position:fixed;
    inset:0;
    z-index:-1;
    background:
    radial-gradient(circle at center,
    transparent 20%,
    #050505 90%);
}

/* GRID */

.geo-bg{
    background-image:
    linear-gradient(rgba(255,255,255,.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.015) 1px, transparent 1px);

    background-size:40px 40px;
}

/* SIDEBAR */

.sidebar-item{
    transition:.2s;
    border-bottom:1px solid rgba(255,255,255,.03);
}

.sidebar-item:hover{
    background:rgba(255,255,255,.04);
}

.active-lesson{
    background:rgba(168,85,247,.12);
    border-left:3px solid #a855f7;
    color:white !important;
}

/* QUIZ */

.option-btn{
    width:100%;
    padding:18px 22px;
    border-radius:18px;

    text-align:left;

    background:rgba(20,20,23,.65);

    border:1px solid rgba(255,255,255,.05);

    color:#d4d4d8;

    transition:.2s;

    font-weight:600;
}

.option-btn:hover:not(:disabled){
    transform:translateX(4px);

    border-color:rgba(168,85,247,.5);

    background:rgba(168,85,247,.08);

    color:white;
}

.option-btn:disabled{
    cursor:default;
}

.correct-glow{
    border-color:#2dd4bf !important;
    background:rgba(45,212,191,.08) !important;
    color:#2dd4bf !important;
}

.wrong-shake{
    animation:shake .3s;
    border-color:#ef4444 !important;
    color:#f87171 !important;
}

/* CODE */

.code-container{
    background:rgba(9,9,11,.82);

    border:1px solid rgba(255,255,255,.05);

    border-radius:24px;

    padding:50px 24px 24px;

    position:relative;

    backdrop-filter:blur(18px);
}

.code-container::before{
    content:'';

    position:absolute;

    top:18px;
    left:20px;

    width:10px;
    height:10px;

    border-radius:50%;

    background:#ef4444;

    box-shadow:
    16px 0 0 #f59e0b,
    32px 0 0 #10b981;
}

.code-block-style{
    font-family:monospace;
    font-size:14px;
    line-height:1.8;
    white-space:pre-wrap;
    color:#e4e4e7;
}

/* ANIMATION */

@keyframes shake{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-4px)}
    75%{transform:translateX(4px)}
}

.fade-up{
    animation:fade .4s ease;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* SCROLLBAR */

::-webkit-scrollbar{
    width:4px;
}

::-webkit-scrollbar-thumb{
    background:#27272a;
}

</style>
</head>

<body class="geo-bg">

<video autoplay muted loop playsinline id="bg-video">
    <source src="gg-video.mp4" type="video/mp4">
</video>

<div class="video-overlay"></div>

<!-- NAVBAR -->

<nav class="fixed top-0 w-full h-14 z-50 flex items-center justify-between px-6 bg-black/50 backdrop-blur-md border-b border-white/5">

    <a id="backBtn"
       href="course.html"
       class="text-zinc-500 hover:text-white transition font-bold text-xs uppercase tracking-widest">

       ← กลับ
    </a>

    <h1 class="text-[#a855f7] font-black italic tracking-tight">
        ZENITH.
    </h1>

    <select
        id="langSelect"
        onchange="changeLanguage()"
        class="bg-zinc-900 border border-white/10 rounded-xl px-2 py-1 text-xs">

        <option value="th">TH</option>
        <option value="en">EN</option>

    </select>

</nav>

<div class="flex pt-14 min-h-screen">

    <!-- SIDEBAR -->

    <aside class="w-64 bg-black/30 border-r border-white/5 backdrop-blur-md overflow-y-auto">

        <div class="p-5 border-b border-white/5">

            <p class="text-[10px] text-zinc-500 uppercase tracking-widest mb-2">
                คอร์สนี้
            </p>

            <h2 id="sidebarTitle"
                class="font-black text-white text-sm">
            </h2>

            <p id="progressText"
               class="text-[11px] text-zinc-400 mt-2">
               1 / 12 บทเรียน
            </p>

            <div class="w-full h-1.5 rounded-full bg-zinc-900 mt-2 overflow-hidden">
                <div id="sidebarProgress"
                     class="h-full bg-[#a855f7] rounded-full"
                     style="width:0%">
                </div>
            </div>

        </div>

        <div id="lessonList"></div>

    </aside>

    <!-- MAIN -->

    <main class="flex-1 overflow-y-auto">

        <div class="max-w-3xl mx-auto px-8 py-10">

            <!-- TITLE -->

            <div class="mb-8 fade-up">

                <p class="text-[10px] uppercase tracking-widest text-[#a855f7] font-black mb-2">
                    บทเรียน
                </p>

                <h1 id="lessonTitle"
                    class="text-4xl font-black tracking-tight">
                    กำลังโหลด...
                </h1>

                <p id="lessonDesc"
                   class="text-zinc-400 mt-4 leading-relaxed">
                   กำลังโหลดข้อมูล...
                </p>

            </div>

            <!-- CODE -->

            <div id="codeContainer"
                 class="code-container hidden mb-8 fade-up">

                <pre><code id="codeBlock" class="code-block-style"></code></pre>

            </div>

            <!-- QUIZ BUTTON -->

            <button
                id="startQuizBtn"
                onclick="switchToQuizMode()"
                class="w-full py-5 rounded-2xl font-black bg-gradient-to-r from-purple-600 to-indigo-600 hover:scale-[1.01] transition">

                เข้าใจแล้ว ไปทำควิซ 🚀

            </button>

            <!-- QUIZ -->

            <div id="quizSection"
                 class="hidden mt-8 fade-up">

                <p id="questionText"
                   class="text-xl font-bold mb-5">
                </p>

                <div id="optionsContainer"
                     class="space-y-4">
                </div>

                <div id="quizFeedback"
                     class="mt-5 font-bold">
                </div>

            </div>

            <!-- NEXT -->

            <button
                id="nextLessonBtn"
                onclick="nextLesson()"
                class="hidden w-full mt-8 py-4 rounded-2xl font-black bg-gradient-to-r from-[#a855f7] to-[#2dd4bf] text-black">

                ไปบทถัดไป →

            </button>

        </div>

    </main>

</div>

<script>

const params = new URLSearchParams(window.location.search);

window.courseType = params.get('course') || 'python';

currentLessonId = parseInt(params.get('id') || '1');

document.getElementById('backBtn').href =
`course.html?course=${window.courseType}`;

const ds = document.createElement('script');

ds.src = `assets/js/${window.courseType}_data.js`;

ds.onload = () => {

    if(typeof courseData === 'undefined'){

        document.getElementById('lessonTitle').textContent =
        'ไม่พบข้อมูลคอร์ส';

        return;
    }

    document.getElementById('sidebarTitle').textContent =
    courseData.title;

    const ms = document.createElement('script');

    ms.src = 'assets/js/main.js';

    ms.onload = () => {

        if(typeof updateUI === 'function'){
            updateUI();
        }

    };

    document.head.appendChild(ms);

};

document.head.appendChild(ds);

</script>

</body>
</html>
