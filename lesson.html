<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zenith | Classroom</title>

<script src="assets/js/theme.js"></script>
<link rel="stylesheet" href="assets/css/theme-variables.css">
<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

body{
    font-family:'Kanit',sans-serif;
    background:#050505;
    color:white;
    overflow-x:hidden;
}

/* VIDEO */

#bg-video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-2;
    opacity:.18;
    filter:brightness(.45);
}

.video-overlay{
    position:fixed;
    inset:0;
    z-index:-1;
    background:
    radial-gradient(circle at center,
    transparent 20%,
    #050505 90%);
}

/* GRID */

.geo-bg{
    background-image:
    linear-gradient(rgba(255,255,255,.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.015) 1px, transparent 1px);

    background-size:40px 40px;
}

/* SIDEBAR */

.sidebar-item{
    transition:.2s;
    border-bottom:1px solid rgba(255,255,255,.03);
}

.sidebar-item:hover{
    background:rgba(255,255,255,.04);
}

.active-lesson{
    background:rgba(168,85,247,.12);
    border-left:3px solid #a855f7;
    color:white !important;
}

/* QUIZ */

.option-btn{
    width:100%;
    padding:18px 22px;
    border-radius:18px;

    text-align:left;

    background:rgba(20,20,23,.65);

    border:1px solid rgba(255,255,255,.05);

    color:#d4d4d8;

    transition:.2s;

    font-weight:600;
}

.option-btn:hover:not(:disabled){
    transform:translateX(4px);

    border-color:rgba(168,85,247,.5);

    background:rgba(168,85,247,.08);

    color:white;
}

.option-btn:disabled{
    cursor:default;
}

.correct-glow{
    border-color:#2dd4bf !important;
    background:rgba(45,212,191,.08) !important;
    color:#2dd4bf !important;
}

.wrong-shake{
    animation:shake .3s;
    border-color:#ef4444 !important;
    color:#f87171 !important;
}

/* CODE */

.code-container{
    background:rgba(9,9,11,.82);

    border:1px solid rgba(255,255,255,.05);

    border-radius:24px;

    padding:50px 24px 24px;

    position:relative;

    backdrop-filter:blur(18px);
}

.code-container::before{
    content:'';

    position:absolute;

    top:18px;
    left:20px;

    width:10px;
    height:10px;

    border-radius:50%;

    background:#ef4444;

    box-shadow:
    16px 0 0 #f59e0b,
    32px 0 0 #10b981;
}

.code-block-style{
    font-family:monospace;
    font-size:14px;
    line-height:1.8;
    white-space:pre-wrap;
    color:#e4e4e7;
}

/* ANIMATION */

@keyframes shake{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-4px)}
    75%{transform:translateX(4px)}
}

.fade-up{
    animation:fade .4s ease;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* SCROLLBAR */

::-webkit-scrollbar{
    width:4px;
}

::-webkit-scrollbar-thumb{
    background:#27272a;
}

/* SKELETON */
@keyframes skeletonShimmer {
    0%   { background-position: -600px 0; }
    100% { background-position:  600px 0; }
}
.skel {
    background: linear-gradient(90deg,
        rgba(168,85,247,0.05) 25%,
        rgba(168,85,247,0.13) 50%,
        rgba(168,85,247,0.05) 75%);
    background-size: 1200px 100%;
    animation: skeletonShimmer 1.8s infinite linear;
    border-radius: 10px;
}
@keyframes skelFadeOut { to { opacity: 0; pointer-events: none; } }
.skel-out { animation: skelFadeOut 0.4s ease forwards; }

/* MOBILE DRAWER */
@media (max-width: 767px) {
    #sidebar {
        position: fixed;
        top: 56px;
        left: 0;
        bottom: 0;
        width: 280px !important;
        z-index: 45;
        transform: translateX(-100%);
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #sidebar.drawer-open {
        transform: translateX(0);
        box-shadow: 8px 0 32px rgba(0, 0, 0, 0.7);
    }
}
#drawerOverlay {
    display: none;
    position: fixed;
    inset: 0;
    top: 56px;
    background: rgba(0, 0, 0, 0.65);
    z-index: 44;
    -webkit-backdrop-filter: blur(2px);
    backdrop-filter: blur(2px);
}
#drawerOverlay.visible { display: block; }

</style>
</head>

<body class="geo-bg">

<video autoplay muted loop playsinline id="bg-video">
    <source src="gg-video.mp4" type="video/mp4">
</video>

<div class="video-overlay"></div>

<!-- NAVBAR -->

<nav class="fixed top-0 w-full h-14 z-50 flex items-center justify-between px-6 bg-black/50 backdrop-blur-md border-b border-white/5">

    <a id="backBtn"

    </a>

    <h1 class="text-[#a855f7] font-black italic tracking-tight">
        ZENITH.
    </h1>

    <div class="flex items-center gap-3">
        <button type="button" id="menuBtn" onclick="toggleDrawer()" title="เปิดเมนูบทเรียน"
            class="md:hidden p-2 rounded-xl bg-white/5 hover:bg-white/10 active:scale-95 transition text-zinc-400 hover:text-white">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
        </button>
        <a href="profile.html" class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest hover:text-[#a855f7] transition hidden md:block">Profile</a>
        <button type="button" onclick="window.toggleTheme()" class="theme-toggle-btn" aria-label="Toggle theme">
            <svg class="icon-sun" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M18.364 18.364l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"/></svg>
            <svg class="icon-moon" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/></svg>
        </button>
        <select
            id="langSelect"
            title="เลือกภาษา"

            class="bg-zinc-900 border border-white/10 rounded-xl px-2 py-1 text-xs">
            <option value="th">TH</option>
            <option value="en">EN</option>
        </select>
    </div>

</nav>

<div class="flex pt-14 min-h-screen">

    <!-- SKELETON OVERLAY -->
    <div id="skelOverlay" class="fixed inset-0 top-14 z-40 flex bg-[#050505]">
        <!-- Sidebar skeleton -->
        <div class="w-64 flex-shrink-0 border-r border-white/5 p-5">
            <div class="skel h-3 w-16 mb-3 rounded"></div>
            <div class="skel h-5 w-40 mb-2 rounded"></div>
            <div class="skel h-3 w-24 mb-2 rounded"></div>
            <div class="skel h-1.5 w-full mb-6 rounded-full"></div>
            <div class="space-y-px">
                <div class="py-3 px-4 flex items-center gap-3">
                    <div class="skel w-7 h-7 rounded-lg flex-shrink-0"></div>
                    <div class="skel h-3 w-32 rounded"></div>
                </div>
                <div class="py-3 px-4 flex items-center gap-3">
                    <div class="skel w-7 h-7 rounded-lg flex-shrink-0"></div>
                    <div class="skel h-3 w-36 rounded"></div>
                </div>
                <div class="py-3 px-4 flex items-center gap-3">
                    <div class="skel w-7 h-7 rounded-lg flex-shrink-0"></div>
                    <div class="skel h-3 w-28 rounded"></div>
                </div>
                <div class="py-3 px-4 flex items-center gap-3 opacity-70">
                    <div class="skel w-7 h-7 rounded-lg flex-shrink-0"></div>
                    <div class="skel h-3 w-40 rounded"></div>
                </div>
                <div class="py-3 px-4 flex items-center gap-3 opacity-50">
                    <div class="skel w-7 h-7 rounded-lg flex-shrink-0"></div>
                    <div class="skel h-3 w-24 rounded"></div>
                </div>
                <div class="py-3 px-4 flex items-center gap-3 opacity-35">
                    <div class="skel w-7 h-7 rounded-lg flex-shrink-0"></div>
                    <div class="skel h-3 w-32 rounded"></div>
                </div>
                <div class="py-3 px-4 flex items-center gap-3 opacity-20">
                    <div class="skel w-7 h-7 rounded-lg flex-shrink-0"></div>
                    <div class="skel h-3 w-36 rounded"></div>
                </div>
                <div class="py-3 px-4 flex items-center gap-3 opacity-10">
                    <div class="skel w-7 h-7 rounded-lg flex-shrink-0"></div>
                    <div class="skel h-3 w-28 rounded"></div>
                </div>
            </div>
        </div>
        <!-- Main content skeleton -->
        <div class="flex-1 px-8 py-10 max-w-3xl">
            <div class="skel h-3 w-16 mb-4 rounded"></div>
            <div class="skel h-10 w-3/4 mb-4 rounded-xl"></div>
            <div class="skel h-4 w-full mb-2 rounded"></div>
            <div class="skel h-4 w-5/6 mb-2 rounded"></div>
            <div class="skel h-4 w-2/3 mb-8 rounded"></div>

    </div>

    <div id="drawerOverlay" onclick="closeDrawer()"></div>

    <!-- SIDEBAR -->

    <aside id="sidebar" class="w-64 bg-black/30 border-r border-white/5 backdrop-blur-md overflow-y-auto">

        <div class="p-5 border-b border-white/5">

            <p class="text-[10px] text-zinc-500 uppercase tracking-widest mb-2">
                คอร์สนี้
            </p>

            <h2 id="sidebarTitle"
                class="font-black text-white text-sm">
            </h2>

            <p id="progressText"
               class="text-[11px] text-zinc-400 mt-2">
               1 / 12 บทเรียน
            </p>

            <div class="w-full h-1.5 rounded-full bg-zinc-900 mt-2 overflow-hidden">
                <div id="sidebarProgress"
                     class="h-full bg-[#a855f7] rounded-full w-0">
                </div>
            </div>

        </div>

        <div id="lessonList"></div>

    </aside>

    <!-- MAIN -->

    <main class="flex-1 overflow-y-auto">

        <div class="max-w-3xl mx-auto px-8 py-10">

            <!-- TITLE -->

            <div class="mb-8 fade-up">

                <p class="text-[10px] uppercase tracking-widest text-[#a855f7] font-black mb-2">
                    บทเรียน
                </p>

                <h1 id="lessonTitle"
                    class="text-4xl font-black tracking-tight">
                    กำลังโหลด...
                </h1>

                <p id="lessonDesc"
                   class="text-zinc-400 mt-4 leading-relaxed">
                   กำลังโหลดข้อมูล...
                </p>

            </div>

            <!-- CODE -->

            <div id="codeContainer"
                 class="code-container hidden mb-8 fade-up">

                <pre><code id="codeBlock" class="code-block-style"></code></pre>

            </div>

            <!-- QUIZ BUTTON -->

            <button
                type="button"
                id="startQuizBtn"
                onclick="switchToQuizMode()"
                class="w-full py-5 rounded-2xl font-black bg-gradient-to-r from-purple-600 to-indigo-600 hover:scale-[1.01] transition">

                เข้าใจแล้ว ไปทำควิซ 🚀

            </button>

            <!-- QUIZ -->

            <div id="quizSection"
                 class="hidden mt-8 fade-up">

                <p id="questionText"
                   class="text-xl font-bold mb-5">
                </p>

                <div id="optionsContainer"
                     class="space-y-4">
                </div>

                <div id="quizFeedback" class="mt-5 font-bold"></div>

                <div id="cloudSaveIndicator"
                     class="mt-2 text-[11px] font-bold opacity-0 transition-opacity duration-300"
                     style="color:#2dd4bf">
                </div>

            </div>

            <!-- NEXT -->

            <button
                type="button"
                id="nextLessonBtn"
                onclick="nextLesson()"
                class="hidden w-full mt-8 py-4 rounded-2xl font-black bg-gradient-to-r from-[#a855f7] to-[#2dd4bf] text-black">

                ไปบทถัดไป →

            </button>

        </div>

    </main>

</div>

<script type="module">
    import { auth } from './assets/js/firebase.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { syncFromFirestore, saveToFirestore, saveQuizScore } from './assets/js/progress.js';

    function showCloudIndicator(msg, ok = true) {
        const el = document.getElementById('cloudSaveIndicator');
        if (!el) return;
        el.textContent = msg;
        el.style.color   = ok ? '#2dd4bf' : '#ef4444';
        el.style.opacity = '1';
        setTimeout(() => { el.style.opacity = '0'; }, 3500);
    }

    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            window.location.href = 'login.html';
            return;
        }
        await syncFromFirestore();

        // Wrap saveToFirestore เพื่อแสดงสถานะ save บน UI
        window._zenithSaveProgress = async (courseKey, level) => {
            const ok = await saveToFirestore(courseKey, level);
            showCloudIndicator(ok ? '☁ บันทึกลง Cloud แล้ว' : '⚠ บันทึกไม่สำเร็จ ลองใหม่', ok);
        };

        // Wrap saveQuizScore เช่นกัน
        window._zenithSaveQuizScore = async (courseKey, lessonId) => {
            await saveQuizScore(courseKey, lessonId);
        };
    });
</script>

<script>

function toggleDrawer() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('drawerOverlay');
    if (!sidebar || !overlay) return;
    const isOpen = sidebar.classList.toggle('drawer-open');
    overlay.classList.toggle('visible', isOpen);
    document.body.style.overflow = isOpen ? 'hidden' : '';
}

function closeDrawer() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('drawerOverlay');
    if (sidebar) sidebar.classList.remove('drawer-open');
    if (overlay) overlay.classList.remove('visible');
    document.body.style.overflow = '';
}

const params = new URLSearchParams(window.location.search);

window.courseType = params.get('course') || 'python';

currentLessonId = parseInt(params.get('id') || '1');

document.getElementById('backBtn').href = 'index.html';

const ds = document.createElement('script');

ds.src = `assets/js/${window.courseType}_data.js`;

ds.onload = () => {

    if(typeof courseData === 'undefined'){

        document.getElementById('lessonTitle').textContent =
        'ไม่พบข้อมูลคอร์ส';

        return;
    }

    document.getElementById('sidebarTitle').textContent =
    courseData.title;

    const ms = document.createElement('script');

    ms.src = 'assets/js/main.js';

    ms.onload = () => {
        if(typeof updateUI === 'function'){
            updateUI();
        }
        const overlay = document.getElementById('skelOverlay');
        if (overlay) {
            overlay.classList.add('skel-out');
            setTimeout(() => overlay.remove(), 420);
        }
    };

    document.head.appendChild(ms);

};

document.head.appendChild(ds);

</script>

</body>
</html>
