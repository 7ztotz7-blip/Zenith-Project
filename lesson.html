<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith | ห้องเรียน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { font-family:'Kanit',sans-serif; background:#050505; color:#fff; }

        .option-btn {
            background:#0d0d0e; border:1px solid rgba(168,85,247,0.2);
            border-radius:16px; padding:16px 20px; text-align:left;
            font-weight:700; color:#a1a1aa; width:100%;
            transition:all .25s cubic-bezier(.4,0,.2,1);
            cursor:pointer; font-family:'Kanit',sans-serif;
        }
        .option-btn:hover  { border-color:#a855f7; background:rgba(168,85,247,.08); color:white; transform:scale(1.01); }
        .option-btn:disabled { cursor:default; transform:none; opacity:0.5; }

        .sidebar-item { border-bottom:1px solid #18181b; transition:all .2s; cursor:pointer; }
        .sidebar-item:hover:not(.active-lesson) { background:#111; }
        .active-lesson { background:rgba(168,85,247,.15)!important; border-left:3px solid #a855f7; color:white!important; }

        @keyframes fadeUp  { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
        @keyframes shake   { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
        @keyframes pulse   { 0%,100%{transform:scale(1)} 50%{transform:scale(1.03)} }

        .fade-up     { animation:fadeUp .4s ease both; }
        .wrong-shake { animation:shake .35s ease-in-out; }
        .correct-glow { box-shadow:0 0 20px rgba(45,212,191,0.4)!important; border-color:#2dd4bf!important; }

        .code-block {
            background:#0a0a0a; border:1px solid rgba(168,85,247,.2);
            border-radius:16px; padding:20px 24px;
            font-family:'Fira Code','JetBrains Mono','Courier New',monospace;
            font-size:13px; line-height:1.8; position:relative;
            white-space:pre-wrap; word-break:break-word;
            box-shadow:inset 0 2px 10px rgba(0,0,0,0.5);
            color:#d1d5db;
        }
        .code-block::before {
            content:''; position:absolute; top:0; left:0; right:0;
            height:2px; background:linear-gradient(90deg,#a855f7,#2dd4bf);
            border-radius:16px 16px 0 0;
        }
        .code-block::after {
            content:''; position:absolute; top:0; right:0;
            width:100px; height:100px;
            background:radial-gradient(circle at top right,rgba(168,85,247,0.08),transparent 70%);
            pointer-events:none;
        }

        .xp-bar-bg  { background:rgba(168,85,247,.1); border-radius:99px; height:6px; overflow:hidden; }
        .xp-bar-fill{ background:linear-gradient(90deg,#a855f7,#2dd4bf); height:100%; border-radius:99px; transition:width .7s ease; }

        #nextLessonBtn { animation:pulse 1.5s ease-in-out infinite; }

        ::-webkit-scrollbar{width:4px} ::-webkit-scrollbar-thumb{background:#3f3f46;border-radius:4px}
    </style>
</head>
<body class="flex flex-col min-h-screen">

<!-- TOP NAV -->
<nav class="fixed top-0 w-full z-50 h-14 flex items-center justify-between px-6 bg-black/80 backdrop-blur-md border-b border-white/5">
    <a id="backBtn" href="course.html" class="flex items-center gap-2 text-gray-500 hover:text-[#a855f7] font-black text-xs uppercase tracking-widest transition">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7"/></svg>
        กลับ
    </a>
    <h1 class="text-base font-black text-[#a855f7] italic">ZENITH.</h1>
    <select id="langSelect" onchange="changeLanguage()" class="bg-zinc-900 border border-zinc-700 text-gray-300 text-xs px-3 py-1.5 rounded-lg font-bold">
        <option value="th">🇹🇭 TH</option>
        <option value="en">🇺🇸 EN</option>
    </select>
</nav>

<div class="flex flex-1 pt-14">

    <!-- SIDEBAR -->
    <aside class="w-64 bg-black/60 border-r border-white/5 flex flex-col flex-shrink-0 sticky top-14 overflow-y-auto" style="height:calc(100vh - 56px)">
        <!-- XP Section -->
        <div class="p-5 border-b border-white/5">
            <div class="flex items-center justify-between mb-2">
                <p class="text-[9px] text-gray-600 uppercase tracking-widest font-black">XP Progress</p>
                <span id="levelBadge" class="text-[9px] font-black text-[#a855f7] bg-[#a855f7]/10 border border-[#a855f7]/20 px-2 py-0.5 rounded-full">LV 1</span>
            </div>
            <div class="xp-bar-bg mb-1"><div class="xp-bar-fill" id="xpBar" style="width:0%"></div></div>
            <p class="text-[9px] text-gray-600" id="xpText">0 / 200 XP</p>
            <p class="text-[#2dd4bf] text-[10px] mt-2 font-bold" id="streakDisplay">🔥 0 วัน Streak</p>
        </div>
        <!-- Course info -->
        <div class="p-5 border-b border-white/5">
            <p class="text-[9px] text-gray-600 uppercase tracking-widest font-bold mb-1">คอร์สนี้</p>
            <h2 id="sidebarTitle" class="text-sm font-black text-white italic"></h2>
            <div class="mt-3 bg-zinc-900 rounded-full h-1.5 overflow-hidden">
                <div id="sidebarProgress" class="h-1.5 rounded-full bg-[#a855f7] transition-all duration-700" style="width:0%"></div>
            </div>
        </div>
        <!-- Lesson list -->
        <div id="lessonList" class="flex-1"></div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 overflow-y-auto">
        <div class="max-w-2xl mx-auto px-8 py-10">

            <!-- Lesson header -->
            <div class="mb-8 fade-up">
                <p class="text-[9px] text-gray-600 uppercase tracking-widest font-bold mb-2">บทเรียน</p>
                <h1 id="lessonTitle" class="text-3xl font-black italic text-white tracking-tight"></h1>
                <p id="lessonDesc" class="text-gray-500 text-sm mt-2 leading-relaxed"></p>
            </div>

            <!-- Code block -->
            <div id="codeBlock" class="code-block mb-8 hidden fade-up"></div>

            <!-- Quiz -->
            <div class="fade-up" style="animation-delay:.1s">
                <div class="flex items-center gap-3 mb-5">
                    <div class="w-8 h-8 bg-[#a855f7]/20 border border-[#a855f7]/30 rounded-xl flex items-center justify-center flex-shrink-0">
                        <span class="text-[#a855f7] text-sm font-black">?</span>
                    </div>
                    <div>
                        <p class="text-[9px] text-gray-600 uppercase tracking-widest font-bold">ทดสอบความเข้าใจ</p>
                        <p id="questionText" class="text-white font-bold text-sm mt-0.5"></p>
                    </div>
                </div>
                <div id="optionsContainer" class="space-y-3"></div>
                <div id="quizFeedback" class="mt-5 font-black text-lg min-h-[1.5em]"></div>
            </div>

            <!-- Next lesson button (แสดงหลังตอบถูก) -->
            <button id="nextLessonBtn" onclick="nextLesson()" class="hidden w-full mt-6 py-4 bg-gradient-to-r from-[#a855f7] to-[#2dd4bf] text-white rounded-2xl font-black text-sm uppercase tracking-widest shadow-lg shadow-purple-500/30 transition-all hover:scale-[1.02] active:scale-95">
                ไปบทถัดไป →
            </button>

            <!-- Navigation buttons -->
            <div class="flex gap-3 mt-4 fade-up" style="animation-delay:.2s">
                <button onclick="prevLesson()" class="flex-1 py-3.5 border border-zinc-800 text-gray-500 rounded-xl font-black text-xs uppercase tracking-widest hover:border-[#a855f7] hover:text-[#a855f7] transition-all">
                    ← ก่อนหน้า
                </button>
                <button onclick="nextLesson()" class="flex-1 py-3.5 bg-zinc-900 border border-zinc-800 text-gray-400 rounded-xl font-black text-xs uppercase tracking-widest hover:border-white/20 hover:text-white transition-all">
                    ข้ามบทนี้ →
                </button>
            </div>
        </div>
    </main>
</div>

<script>
    // ── กำหนด courseType ก่อน load main.js เสมอ ──────────────
    const params = new URLSearchParams(window.location.search);
    window.courseType  = params.get('course') || 'python';   // ← สำคัญมาก
    currentLessonId    = parseInt(params.get('id') || '1');  // ← ใช้ global var

    document.getElementById('backBtn').href = `course.html?course=${window.courseType}`;

    // แสดง streak
    const streak = parseInt(localStorage.getItem('zenith_streak') || '0');
    document.getElementById('streakDisplay').textContent = `🔥 ${streak} วัน Streak`;

    // ── โหลด data file ก่อน จากนั้นโหลด main.js ──────────────
    const ds = document.createElement('script');
    ds.src = `assets/js/${window.courseType}_data.js`;

    ds.onload = () => {
        if (typeof courseData === 'undefined') {
            document.getElementById('lessonTitle').textContent = '❌ ไม่พบข้อมูลคอร์ส';
            return;
        }
        // แสดงชื่อคอร์สใน sidebar
        document.getElementById('sidebarTitle').textContent = courseData.title;

        // โหลด main.js หลังจาก data พร้อมแล้ว
        const ms = document.createElement('script');
        ms.src = 'assets/js/main.js';
        ms.onload = () => {
            // main.js โหลดเสร็จ เรียก updateUI
            if (typeof updateUI === 'function') {
                updateUI();
            }
        };
        ms.onerror = () => {
            document.getElementById('lessonTitle').textContent = '❌ โหลด main.js ไม่ได้';
        };
        document.head.appendChild(ms);
    };

    ds.onerror = () => {
        document.getElementById('lessonTitle').textContent = `❌ ไม่พบไฟล์ ${window.courseType}_data.js`;
        document.getElementById('lessonDesc').textContent  = 'กรุณาตรวจสอบว่าไฟล์อยู่ใน assets/js/ ครับ';
    };

    document.head.appendChild(ds);
</script>
</body>
</html>
