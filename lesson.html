<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>บทเรียน — ZENITH</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link href="assets/css/pystart.css" rel="stylesheet" />
<script src="assets/js/theme.js"></script>
<style>
  body{padding-bottom:0;}
  .topbar{height:50px;}
  .tb-back{display:flex;align-items:center;gap:8px;padding:0 16px;height:100%;border-right:1px solid var(--line);font-size:13px;color:var(--muted);font-weight:500;transition:color .15s,background .15s;white-space:nowrap;text-decoration:none;}
  .tb-back:hover{color:var(--accent-deep);background:var(--accent-soft);}
  .tb-logo{padding:0 14px;height:100%;border-right:1px solid var(--line);font-size:15px;}
  .tb-mk{width:24px;height:24px;border-radius:6px;font-size:11px;}
  .tb-crumb{padding:0 16px;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
  .tb-crumb .sep{opacity:.4;}
  .tb-crumb .cur{color:var(--ink);font-weight:600;}
  .chiplet{height:28px;padding:0 10px;border-radius:7px;font-size:12px;}
  .tb-av{width:28px;height:28px;font-size:11px;}

  .prog-strip{position:sticky;top:50px;z-index:49;height:2px;background:var(--line-soft);}
  .prog-strip .pf{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));width:0%;transition:width .5s ease;}

  .page-wrap{display:flex;min-height:calc(100vh - 52px);}
  .sidebar{width:260px;flex-shrink:0;background:oklch(0.128 0.015 262);border-right:1px solid oklch(0.21 0.015 262);
    display:flex;flex-direction:column;position:sticky;top:52px;height:calc(100vh - 52px);overflow:hidden;
    transition:width .25s cubic-bezier(.4,0,.2,1);z-index:40;}
  .sidebar.closed{width:0;border-right:none;}
  .sb-head{padding:18px 16px 14px;border-bottom:1px solid oklch(0.21 0.015 262);flex-shrink:0;}
  .sb-title{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:oklch(0.48 0.02 264);margin-bottom:4px;font-family:'IBM Plex Mono',monospace;}
  .sb-course{font-size:13.5px;font-weight:600;color:oklch(0.88 0.01 260);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sb-body{flex:1;overflow-y:auto;padding:8px 0;}
  .sb-body::-webkit-scrollbar{width:0;}
  .sb-item{display:flex;align-items:center;gap:10px;padding:8px 16px;cursor:pointer;transition:background .15s;position:relative;min-width:0;white-space:nowrap;text-decoration:none;}
  .sb-item:hover{background:oklch(0.158 0.016 262);}
  .sb-item.active{background:oklch(0.62 0.19 300 / .18);}
  .sb-item.active::before{content:'';position:absolute;left:0;top:5px;bottom:5px;width:3px;border-radius:0 2px 2px 0;background:var(--accent);}
  .sb-item.locked{opacity:.45;cursor:not-allowed;pointer-events:none;}
  .sb-ic{width:22px;height:22px;border-radius:6px;flex-shrink:0;display:grid;place-items:center;font-size:10px;font-family:'IBM Plex Mono',monospace;font-weight:700;border:1.5px solid;}
  .sb-ic.done{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok-deep);}
  .sb-ic.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .sb-ic.lock{background:oklch(0.19 0.015 262);border-color:oklch(0.21 0.015 262);color:oklch(0.48 0.02 264);}
  .sb-tx{flex:1;min-width:0;}
  .sb-num{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:oklch(0.48 0.02 264);margin-bottom:1px;}
  .sb-name{font-size:12.5px;color:oklch(0.88 0.01 260);font-weight:500;overflow:hidden;text-overflow:ellipsis;}
  .sb-item.active .sb-name{color:#fff;font-weight:600;}
  .sb-foot{border-top:1px solid oklch(0.21 0.015 262);padding:13px 16px;flex-shrink:0;}
  .xp-label{display:flex;justify-content:space-between;font-size:11.5px;color:oklch(0.48 0.02 264);margin-bottom:6px;}
  .xp-label strong{color:oklch(0.88 0.01 260);}
  .xp-track{height:4px;border-radius:100px;background:oklch(0.19 0.015 262);overflow:hidden;}
  .xp-fill{height:100%;border-radius:100px;background:linear-gradient(90deg,var(--accent),var(--accent-2));width:0%;transition:width .5s ease;}
  .sb-toggle{position:fixed;top:62px;left:12px;z-index:45;width:32px;height:32px;border-radius:8px;
    background:var(--card);border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;
    transition:background .15s,border-color .15s,left .25s;box-shadow:var(--shadow-sm);}
  .sb-toggle:hover{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-deep);}

  .content-wrap{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;}
  .content{max-width:780px;margin:0 auto;padding:44px 32px 80px;}

  .step-pill{display:inline-flex;align-items:center;gap:8px;padding:4px 12px;border-radius:100px;background:var(--accent-soft);border:1px solid var(--accent-line);font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent-deep);margin-bottom:16px;}
  .step-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);}

  .l-title{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin-bottom:12px;}
  .l-desc{font-size:16px;line-height:1.8;color:var(--muted);margin-bottom:26px;}

  .sdiv{border:none;height:1px;background:var(--line-soft);margin:32px 0;}

  .inline-code{margin:18px 0 24px;border-radius:11px;overflow:hidden;border:1px solid var(--edl);box-shadow:var(--shadow-md);}
  .ic-bar{display:flex;align-items:center;gap:6px;padding:9px 14px;background:var(--ed2);border-bottom:1px solid var(--edl);}
  .ic-dot{width:9px;height:9px;border-radius:50%;}
  .ic-fname{margin-left:8px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--eddim);}
  .ic-body{padding:16px 20px;font-family:'IBM Plex Mono',monospace;font-size:13.5px;line-height:1.85;white-space:pre;color:var(--edtx);background:var(--ed);overflow-x:auto;}
  .ic-body .k{color:var(--kw);} .ic-body .f{color:var(--fn);} .ic-body .s{color:var(--str);} .ic-body .n{color:var(--num);} .ic-body .c{color:var(--cmt);}

  .qty{display:flex;align-items:center;gap:9px;margin-bottom:16px;}
  .qty .sn{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:#fff;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;background:linear-gradient(140deg,var(--warm),var(--warm-deep));flex-shrink:0;}
  .qty .st{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--warm-deep);}

  .q-card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:20px 22px;}
  .q-card.answered{border-color:var(--line-soft);}
  .q-text{font-size:16px;font-weight:600;color:var(--ink);line-height:1.5;margin-bottom:14px;}
  .q-opts{display:flex;flex-direction:column;gap:8px;}
  .q-opt{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-size:14.5px;color:var(--ink);transition:border-color .15s,background .15s;text-align:left;}
  .q-opt:hover:not(:disabled){border-color:var(--accent-line);background:var(--accent-soft);}
  .q-opt .q-ic{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);flex-shrink:0;display:grid;place-items:center;font-size:10px;transition:.15s;}
  .q-opt.correct{border-color:var(--ok-line);background:var(--ok-soft);color:var(--ok-deep);cursor:default;}
  .q-opt.correct .q-ic{background:var(--ok);border-color:var(--ok);color:#fff;}
  .q-opt.wrong{border-color:oklch(0.86 0.08 20);background:oklch(0.97 0.02 20);color:oklch(0.45 0.12 22);cursor:default;}
  .q-opt.wrong .q-ic{background:oklch(0.7 0.15 22);border-color:oklch(0.7 0.15 22);color:#fff;}

  .actionbar{display:flex;align-items:center;gap:12px;margin-top:22px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm);flex-wrap:wrap;}
  .ab-status{display:flex;align-items:center;gap:11px;flex:1;min-width:200px;}
  .ab-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--soft);color:var(--faint);flex-shrink:0;}
  .ab-ic.ok{background:var(--ok-soft);color:var(--ok-deep);}
  .ab-tx b{display:block;font-size:14px;font-weight:600;}
  .ab-tx span{font-size:12.5px;color:var(--muted);}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(28px);z-index:60;display:flex;align-items:center;gap:11px;padding:11px 18px 11px 12px;border-radius:13px;background:var(--card);border:1px solid var(--ok-line);opacity:0;pointer-events:none;box-shadow:var(--shadow-md);transition:transform .38s cubic-bezier(.2,.7,.2,1),opacity .28s;}
  .toast.show{transform:translateX(-50%);opacity:1;}
  .toast .t-ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:16px;background:linear-gradient(140deg,var(--ok),var(--ok-deep));flex-shrink:0;}
  .toast b{font-size:13px;display:block;line-height:1.3;}
  .toast span{font-size:12px;color:var(--muted);}
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:55;overflow:hidden;}
  .confetti i{position:absolute;top:-12px;width:8px;height:13px;border-radius:2px;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(105vh) rotate(600deg);}}

  @media(max-width:780px){.tb-crumb{display:none;} .content{padding:32px 20px 60px;}}
</style>
</head>

<script type="module">
import { auth } from './assets/js/firebase.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { syncFromFirestore, saveToFirestore, saveQuizScore } from './assets/js/progress.js';

const UNITS = [
  { n:1, start:1,  end:6,  title:'พื้นฐาน Python' },
  { n:2, start:7,  end:11, title:'ควบคุมทิศทาง' },
  { n:3, start:12, end:16, title:'โครงสร้างข้อมูล' },
  { n:4, start:17, end:20, title:'ฟังก์ชัน' },
  { n:5, start:21, end:24, title:'OOP' },
];
const TOTAL = 24;
const COURSE = 'python';

const params = new URLSearchParams(location.search);
const lessonId = Math.min(Math.max(parseInt(params.get('id')) || 1, 1), TOTAL);

function getUnlocked() { return parseInt(localStorage.getItem(`zenith_progress_${COURSE}`) || '1'); }
function getDone() { return Math.max(0, getUnlocked() - 1); }
function unitOf(id) { return UNITS.find(u => id >= u.start && id <= u.end); }

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
const KW=new Set(['for','in','while','if','elif','else','def','return','import','from','as','and','or','not','True','False','None','break','continue','pass','class','with','try','except','finally','global']);
const BI=new Set(['print','input','range','int','str','float','len','list','dict','set','tuple','sum','min','max','abs','round','type','sorted']);
function highlight(code){
  return code.split('\n').map(line=>{
    let out='',i=0;
    while(i<line.length){
      const r=line.slice(i);
      if(r[0]==='#'){out+='<span class="c">'+esc(r)+'</span>';break;}
      const sm=r.match(/^(['"])(?:\\.|(?!\1).)*\1?/);
      if(sm){out+='<span class="s">'+esc(sm[0])+'</span>';i+=sm[0].length;continue;}
      const nm=r.match(/^\d+\.?\d*/);
      if(nm){out+='<span class="n">'+esc(nm[0])+'</span>';i+=nm[0].length;continue;}
      const wm=r.match(/^[A-Za-z_]\w*/);
      if(wm){const w=wm[0];if(KW.has(w))out+='<span class="k">'+w+'</span>';else if(BI.has(w))out+='<span class="f">'+w+'</span>';else out+=esc(w);i+=w.length;continue;}
      out+=esc(r[0]);i++;
    }
    return out;
  }).join('\n');
}

function shuffle(quiz) {
  const opts = quiz.options.map((o, i) => ({ o, correct: i === quiz.ans }));
  for (let i = opts.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [opts[i], opts[j]] = [opts[j], opts[i]]; }
  return opts;
}

function renderSidebar() {
  const unit = unitOf(lessonId);
  const done = getDone();
  document.getElementById('sb-unit-label').textContent = `หน่วยที่ ${unit.n} · ${unit.end - unit.start + 1} บท`;
  document.getElementById('sb-unit-title').textContent = unit.title;
  document.getElementById('crumb-unit').textContent = `หน่วยที่ ${unit.n} · ${unit.title}`;

  const body = document.getElementById('sb-body');
  body.innerHTML = '';
  for (let id = unit.start; id <= unit.end; id++) {
    const lesson = courseData.lessons.find(l => l.id === id);
    const isDone = id <= done;
    const isActive = id === lessonId;
    const isLocked = id > done + 1;
    const tag = isLocked ? 'div' : 'a';
    const href = isLocked ? '' : `href="lesson.html?course=python&id=${id}"`;
    const icHtml = isDone ? '✓' : isLocked ? '🔒' : id;
    const item = document.createElement(tag);
    item.className = 'sb-item' + (isActive ? ' active' : '') + (isLocked ? ' locked' : '');
    if (href) item.setAttribute('href', `lesson.html?course=python&id=${id}`);
    item.innerHTML = `<div class="sb-ic ${isDone ? 'done' : isActive ? 'active' : 'lock'}">${icHtml}</div>
      <div class="sb-tx"><div class="sb-num">บทที่ ${id}</div><div class="sb-name">${lesson.title}</div></div>`;
    body.appendChild(item);
  }

  const pct = Math.min(Math.round((done / TOTAL) * 100), 100);
  document.getElementById('xp-label').textContent = `${done}/${TOTAL}`;
  document.getElementById('xp-fill').style.width = pct + '%';
  document.getElementById('prog-fill').style.width = pct + '%';
}

let currentQuiz = null;
let passed = false;

function renderLesson() {
  const lesson = courseData.lessons.find(l => l.id === lessonId);
  if (!lesson) { window.location.href = 'index.html'; return; }
  const content = lesson.content.th;

  document.getElementById('step-label').textContent = `บทที่ ${lessonId} จาก ${TOTAL}`;
  document.getElementById('crumb-lesson').textContent = `บทที่ ${lessonId} · ${lesson.title}`;
  document.getElementById('l-title').textContent = content.title;
  document.getElementById('l-desc').textContent = content.desc;
  document.title = `บทที่ ${lessonId} · ${lesson.title} — ZENITH`;

  const codeWrap = document.getElementById('code-wrap');
  if (content.code) {
    document.getElementById('code-body').innerHTML = highlight(content.code);
    codeWrap.style.display = '';
  } else {
    codeWrap.style.display = 'none';
  }

  passed = lessonId <= getDone();
  currentQuiz = shuffle(lesson.quiz);
  document.getElementById('q-text').textContent = lesson.quiz.q;
  const optsWrap = document.getElementById('q-opts');
  optsWrap.innerHTML = '';
  currentQuiz.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'q-opt';
    btn.innerHTML = `<span class="q-ic">${String.fromCharCode(65 + i)}</span><span>${opt.o}</span>`;
    btn.addEventListener('click', () => onAnswer(i, btn));
    optsWrap.appendChild(btn);
  });
  document.getElementById('q-card').classList.remove('answered');

  const nextBtn = document.getElementById('next-btn');
  if (passed) {
    setStatus(true, 'ผ่านแล้ว', 'ทำ Quiz นี้ผ่านแล้ว ไปบทถัดไปได้เลย');
    nextBtn.disabled = false;
    disableOptions();
  } else {
    setStatus(false, 'ยังไม่ได้ตอบ', 'เลือกคำตอบด้านบน');
    nextBtn.disabled = true;
  }
}

function disableOptions() {
  document.querySelectorAll('.q-opt').forEach(b => b.disabled = true);
}

function setStatus(ok, title, sub) {
  const ic = document.getElementById('ab-ic');
  ic.classList.toggle('ok', ok);
  ic.innerHTML = ok
    ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
    : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>';
  document.getElementById('ab-title').textContent = title;
  document.getElementById('ab-sub').textContent = sub;
}

async function onAnswer(i, btn) {
  if (passed) return;
  const opts = document.querySelectorAll('.q-opt');
  const correctIdx = currentQuiz.findIndex(o => o.correct);
  if (currentQuiz[i].correct) {
    opts.forEach((b, idx) => { b.disabled = true; if (idx === correctIdx) b.classList.add('correct'); });
    document.getElementById('q-card').classList.add('answered');
    passed = true;
    setStatus(true, 'ถูกต้อง! 🎉', 'ปลดล็อกบทถัดไปแล้ว');
    document.getElementById('next-btn').disabled = false;
    showToast();

    const unlocked = getUnlocked();
    if (lessonId >= unlocked) {
      const nextLevel = lessonId + 1;
      localStorage.setItem(`zenith_progress_${COURSE}`, nextLevel);
      await saveToFirestore(COURSE, nextLevel);
    }
    await saveQuizScore(COURSE, lessonId);
    renderSidebar();
  } else {
    btn.classList.add('wrong');
    setTimeout(() => btn.classList.remove('wrong'), 600);
    setStatus(false, 'ยังไม่ถูก', 'ลองใหม่อีกครั้ง');
  }
}

document.getElementById('next-btn').addEventListener('click', () => {
  if (lessonId >= TOTAL) {
    window.location.href = 'results.html';
  } else {
    window.location.href = `lesson.html?course=python&id=${lessonId + 1}`;
  }
});

function showToast() {
  const toast = document.getElementById('toast');
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('show'), 3200);
  celebrate();
}
function celebrate() {
  const colors = ['oklch(0.7 0.19 300)','oklch(0.72 0.14 200)','oklch(0.78 0.14 145)','oklch(0.8 0.14 80)','oklch(0.7 0.16 25)'];
  const wrap = document.createElement('div'); wrap.className = 'confetti';
  for (let i = 0; i < 60; i++) {
    const c = document.createElement('i');
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = (2.2 + Math.random() * 2) + 's';
    c.style.animationDelay = (Math.random() * .35) + 's';
    c.style.transform = 'rotate(' + (Math.random() * 360) + 'deg)';
    wrap.appendChild(c);
  }
  document.body.appendChild(wrap);
  setTimeout(() => wrap.remove(), 4600);
}

const sidebar = document.getElementById('sidebar'), sbToggle = document.getElementById('sbToggle');
const sbOpen = localStorage.getItem('zenith_sb') !== 'closed';
if (!sbOpen) sidebar.classList.add('closed');
sbToggle.style.left = sidebar.classList.contains('closed') ? '12px' : '272px';
sbToggle.addEventListener('click', () => {
  sidebar.classList.toggle('closed');
  localStorage.setItem('zenith_sb', sidebar.classList.contains('closed') ? 'closed' : 'open');
  sbToggle.style.left = sidebar.classList.contains('closed') ? '12px' : '272px';
});

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = 'login.html'; return; }
  await syncFromFirestore();

  // don't allow skipping ahead via URL manipulation
  if (lessonId > getUnlocked()) { window.location.href = `lesson.html?course=python&id=${getUnlocked()}`; return; }

  renderSidebar();
  renderLesson();
  const name = user.displayName || user.email.split('@')[0];
  document.getElementById('top-avatar').textContent = name.charAt(0).toUpperCase();
});
</script>
</body>
