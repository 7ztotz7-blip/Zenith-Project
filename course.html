<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith Classroom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body { font-family:'Kanit',sans-serif; background:#050505; color:#fff; overflow-x: hidden; }
        
        /* --- เพิ่มความชัดของวิดีโอพื้นหลัง --- */
        #bg-video {
            position: fixed; right: 0; bottom: 0;
            min-width: 100%; min-height: 100%;
            z-index: -2; object-fit: cover; 
            opacity: 0.45; /* 🔥 ปรับเพิ่มขึ้นมาเป็น 45% เพื่อให้วิดีโอชัดเจนขึ้นเต็มตา */
            filter: saturate(1.1) brightness(0.7);
        }
        @media (max-width: 768px) { #bg-video { opacity: 0.25; } } /* บนมือถือปรับเป็น 25% */

        /* ปรับวงเงาดำให้ถอยออกไปที่ขอบจอมากขึ้น วิดีโอตรงกลางจะได้สว่างชัดขึ้น */
        .video-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 45%, #050505 130%);
            z-index: -1; pointer-events: none;
        }
        /* ผสานลายเส้นตาราง Grid เข้ากับเงาวิดีโอ ช่วยให้พื้นหลังดูแน่นมีมิติมาก */
        .geo-bg {
            background-image:
                linear-gradient(rgba(255,255,255,0.012) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.012) 1px, transparent 1px);
            background-size:40px 40px;
        }

        /* Glassmorphic Lesson Cards ปรับพื้นหลังการ์ดให้ทึบขึ้นเล็กน้อยเพื่อสู้แสงวิดีโอ */
        .lesson-card {
            background: rgba(10, 10, 12, 0.8) !important; 
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 24px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(20px);
        }
        .lesson-card:hover:not(.locked) {
            border-color: rgba(168,85,247,0.4); 
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(168,85,247,0.1);
        }
        .lesson-card.locked { opacity:0.25; pointer-events:none; }
        .lesson-card.done   { border-color:rgba(45,212,191,0.2); background: rgba(10, 10, 12, 0.5) !important; }
        
        @keyframes fadeIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
        .fade-in { animation:fadeIn 0.6s ease both; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }

        @media (max-width: 640px) {
            main.max-w-4xl { padding-top: 5.5rem !important; padding-left: 1rem !important; padding-right: 1rem !important; }
            #course-title { font-size: 2.4rem !important; line-height: 1.1 !important; }
            .lesson-card { padding: 20px !important; flex-direction: column !important; align-items: flex-start !important; gap: 16px !important; }
            .lesson-card .flex.items-center.gap-5 { width: 100% !important; }
            .lesson-card .flex-shrink-0.ml-4 { width: 100% !important; margin-left: 0 !important; }
            .lesson-card button { width: 100% !important; padding: 12px !important; }
        }
    </style>
</head>
<body class="min-h-screen geo-bg">

<video autoplay loop muted playsinline id="bg-video">
    <source src="gg-video.mp4" type="video/mp4">
</video>
<div class="video-overlay"></div>

<nav class="fixed top-0 w-full z-50 h-16 flex items-center justify-between px-6 bg-[#050505]/75 backdrop-blur-md border-b border-white/5">
    <a href="index.html" class="flex items-center gap-2 text-zinc-500 hover:text-white font-bold text-xs uppercase tracking-widest transition-all">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7"/></svg>
        กลับหน้าหลัก
    </a>
    <h1 class="text-xl font-black text-[#a855f7] italic tracking-tighter">ZENITH.</h1>
    <div class="hidden sm:block text-[10px] font-bold text-zinc-600 uppercase tracking-widest">Classroom Studio</div>
</nav>

<main class="max-w-4xl mx-auto pt-28 pb-24 px-6">
    
    <div id="loadingState" class="text-center py-24">
        <div class="inline-block w-8 h-8 border-2 border-[#a855f7] border-t-transparent rounded-full animate-spin mb-4"></div>
        <p class="text-zinc-500 text-xs font-bold uppercase tracking-widest">กำลังเชื่อมต่อข้อมูลคอร์สเรียน...</p>
    </div>

    <div id="courseHeader" class="mb-10 fade-in hidden">
        <div id="courseBadge" class="text-[9px] font-black px-3 py-1 rounded-full uppercase w-fit border mb-4 tracking-widest"></div>
        <h1 id="course-title" class="text-4xl md:text-5xl font-black italic tracking-tighter mb-4 leading-tight"></h1>
        <p id="course-desc" class="text-zinc-400 text-sm md:text-base max-w-2xl leading-relaxed"></p>
        
        <div class="mt-8 bg-zinc-950/60 border border-white/5 p-4 rounded-2xl backdrop-blur-md flex flex-col gap-3">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-[#2dd4bf] animate-pulse"></span>
                    <p class="text-[11px] font-black text-zinc-400 uppercase tracking-wider" id="progressLabel">0% เสร็จแล้ว</p>
                </div>
                <p class="text-[11px] font-bold text-zinc-500" id="progressDetail">0 / 0 บท</p>
            </div>
            <div class="w-full bg-zinc-950 rounded-full h-1.5 overflow-hidden p-[2px] border border-white/5">
                <div id="progressBar" class="h-full rounded-full transition-all duration-1000 shadow-[0_0_12px_rgba(168,85,247,0.4)]" style="width:0%"></div>
            </div>
        </div>
    </div>

    <div id="lesson-list" class="space-y-4"></div>
</main>

<script>
    const params = new URLSearchParams(window.location.search);
    const type   = params.get('course') || 'python';

    function getUnlockedLevel(courseType) {
        return parseInt(localStorage.getItem(`zenith_progress_${courseType}`) || '1');
    }

    const themeMap = {
        python:     { badge:'Python Expert', bgClass:'bg-[#2dd4bf]/10 text-[#2dd4bf] border-[#2dd4bf]/25', desc:'จัดการงานซ้ำๆ ให้เป็นระบบอัตโนมัติขั้นสูงด้วย Python สำหรับนวัตกรยุคใหม่' },
        javascript: { badge:'Web Developer', bgClass:'bg-yellow-500/10 text-yellow-400 border-yellow-500/25', desc:'สร้างโครงสร้างเว็บไซต์ให้มีชีวิตชีวา ปรับแต่งฟังก์ชันล้ำสมัยด้วย JavaScript ES6+' },
        react:      { badge:'Frontend Engine', bgClass:'bg-blue-500/10 text-blue-400 border-blue-500/25', desc:'สถาปัตยกรรมการสร้าง Web Application ระดับองค์กรด้วย React Components' },
        php:        { badge:'Backend Developer', bgClass:'bg-[#777bb4]/10 text-[#777bb4] border-[#777bb4]/25', desc:'พัฒนาสคริปต์ฝั่ง Server-side และเชื่อมต่อสถาปัตยกรรมฐานข้อมูลด้วย PHP' },
        sql:        { badge:'Data Master',   bgClass:'bg-[#00758f]/10 text-[#00758f] border-[#00758f]/25', desc:'ออกแบบ จัดการ และคิวรีโครงสร้างฐานข้อมูลความเร็วสูงระดับมืออาชีพด้วย SQL' },
        html:       { badge:'UI/UX Architect', bgClass:'bg-[#e34f26]/10 text-[#e34f26] border-[#e34f26]/25', desc:'วางรากฐานโครงสร้างของเว็บบล็อกและปรับแต่งความงดงามด้วย HTML5 & CSS3' }
    };

    const script = document.createElement('script');
    script.src = `assets/js/${type}_data.js?t=${Date.now()}`;
    script.async = true;

    script.onload = () => {
        document.getElementById('loadingState').classList.add('hidden');
        
        if (typeof courseData === 'undefined') {
            document.getElementById('loadingState').innerHTML = `<p class="text-red-500 text-sm font-bold">Error: ไม่พบข้อมูลสารสนเทศในระบบไฟล์ข้อมูล</p>`;
            return;
        }

        const theme = themeMap[type] || themeMap.python;
        const unlocked = getUnlockedLevel(type);
        const total = courseData.lessons.length;
        const doneLessons = Math.max(0, unlocked - 1);
        const pct = Math.min((doneLessons / total) * 100, 100);

        document.getElementById('courseHeader').classList.remove('hidden');
        
        const badge = document.getElementById('courseBadge');
        badge.textContent = theme.badge;
        badge.className = `text-[9px] font-black px-3 py-1 rounded-full uppercase w-fit border mb-4 tracking-widest ${theme.bgClass}`;
        
        const titleEl = document.getElementById('course-title');
        titleEl.innerText = courseData.title;
        titleEl.style.color = courseData.themeColor;
        
        document.getElementById('course-desc').textContent = theme.desc;
        document.getElementById('progressBar').style.background = courseData.themeColor;
        document.getElementById('progressBar').style.width = pct + '%';
        document.getElementById('progressLabel').textContent = `${Math.round(pct)}% เรียนรู้สำเร็จ`;
        document.getElementById('progressDetail').textContent = `${doneLessons} / ${total} บทเรียน`;

        const list = document.getElementById('lesson-list');
        list.innerHTML = '';

        courseData.lessons.forEach((lesson, idx) => {
            const isUnlocked = lesson.id <= unlocked;
            const isDone = lesson.id < unlocked;
            const isCurrent = lesson.id === unlocked;

            const div = document.createElement('div');
            div.className = `lesson-card p-5 flex justify-between items-center fade-in ${!isUnlocked ? 'locked' : isDone ? 'done' : ''}`;
            div.style.animationDelay = `${idx * 0.05}s`;
            
            div.innerHTML = `
                <div class="flex items-center gap-5 min-w-0">
                    <div class="w-11 h-11 rounded-xl flex items-center justify-center font-black text-xs flex-shrink-0"
                         style="background:${isDone ? 'rgba(45,212,191,0.15)' : isUnlocked ? courseData.themeColor+'15' : 'rgba(255,255,255,0.03)'};
                                color:${isDone ? '#2dd4bf' : isUnlocked ? courseData.themeColor : '#444'}">
                        ${isDone ? '✓' : String(lesson.id).padStart(2,'0')}
                    </div>
                    <div class="min-w-0">
                        <div class="flex items-center gap-2 mb-1">
                            <h3 class="font-bold text-sm md:text-base ${isUnlocked ? 'text-white' : 'text-zinc-600'} tracking-tight">${lesson.title}</h3>
                            ${isCurrent ? '<span class="text-[8px] bg-purple-500/20 text-[#a855f7] border border-purple-500/30 px-1.5 py-0.5 rounded font-black uppercase flex-shrink-0 tracking-wider">Current</span>' : ''}
                        </div>
                        <p class="text-zinc-500 text-xs leading-relaxed truncate">${lesson.desc}</p>
                    </div>
                </div>
                <div class="flex items-center gap-3 flex-shrink-0 ml-4">
                    ${!isUnlocked 
                        ? `<svg class="w-4 h-4 text-zinc-800" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"/></svg>`
                        : `<a href="lesson.html?course=${type}&id=${lesson.id}" class="w-full">
                            <button style="background:${isDone ? 'rgba(45,212,191,0.12)' : courseData.themeColor};color:${isDone ? '#2dd4bf' : 'black'}"
                                class="px-5 py-2.5 rounded-xl font-black text-[10px] uppercase tracking-widest hover:scale-[1.03] active:scale-95 transition-all shadow-md whitespace-nowrap">
                                ${isDone ? 'Review' : 'Start'}
                            </button>
                           </a>`
                    }
                </div>
            `;
            list.appendChild(div);
        });
    };

    script.onerror = () => {
        document.getElementById('loadingState').innerHTML = `<p class="text-red-500 text-sm font-bold">Error: ไม่สามารถเรียกค้นข้อมูลวิชา ${type} ได้</p>`;
    };

    document.head.appendChild(script);
</script>
</body>
</html>
