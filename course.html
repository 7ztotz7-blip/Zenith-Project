<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith Classroom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body { font-family:'Kanit',sans-serif; background:#050505; color:#fff; }
        .lesson-card {
            background:#0d0d0e; border:1px solid rgba(168,85,247,0.15);
            border-radius:20px; transition:all 0.3s ease;
        }
        .lesson-card:hover:not(.locked) {
            border-color:#a855f7; transform:translateX(4px);
            box-shadow:0 0 20px rgba(168,85,247,0.15);
        }
        .lesson-card.locked { opacity:0.4; pointer-events:none; }
        .lesson-card.done   { border-color:rgba(45,212,191,0.3); }
        @keyframes fadeIn { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
        .fade-in { animation:fadeIn 0.5s ease both; }
        .geo-bg {
            background-image:
                linear-gradient(rgba(168,85,247,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(168,85,247,0.04) 1px, transparent 1px);
            background-size:60px 60px;
        }
        ::-webkit-scrollbar{width:6px} ::-webkit-scrollbar-thumb{background:#3f3f46;border-radius:6px}

        /* แก้ไขการแสดงผลสำหรับมือถือ */
@media (max-width: 640px) {
    /* 1. ปรับขนาดหัวข้อคอร์สให้เล็กลงไม่ให้ล้นจอ */
    #course-title {
        font-size: 2.5rem !important; /* จากเดิม text-5xl (3rem) ให้เหลือ 2.5rem */
        line-height: 1;
    }

    /* 2. ปรับระยะห่างของเนื้อหาหลัก */
    main {
        padding-top: 5rem !important; /* ดันลงมาไม่ให้โดน Nav ทับ */
        padding-left: 1rem !important;
        padding-right: 1rem !important;
    }

    /* 3. จัดการ Lesson Card ให้กระชับขึ้น */
    .lesson-card {
        padding: 1rem !important; /* ลดความกว้างขอบใน */
        gap: 0.5rem !important;
    }

    /* 4. แก้ปัญหาปุ่ม "เริ่มเรียน" บีบตัวหนังสือบทเรียน */
    .lesson-card h3 {
        font-size: 0.85rem !important;
        white-space: normal !important; /* ยอมให้ชื่อบทเรียนขึ้นบรรทัดใหม่ได้ */
    }

    /* 5. ปรับขนาดวงกลมตัวเลขบทเรียนให้เล็กลงนิดนึง */
    .lesson-card .flex-shrink-0.w-10 {
        width: 2.25rem !important;
        height: 2.25rem !important;
    }

    /* 6. จัดการ Nav ให้ตัวหนังสือไม่เบียดกัน */
    nav {
        padding-left: 1rem !important;
        padding-right: 1rem !important;
    }
}
    </style>
</head>
<body class="min-h-screen geo-bg">

<nav class="fixed top-0 w-full z-50 h-14 flex items-center justify-between px-8 bg-black/70 backdrop-blur-md border-b border-white/5">
    <a href="index.html" class="flex items-center gap-2 text-gray-500 hover:text-[#a855f7] font-black text-sm uppercase tracking-widest transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7"/></svg>
        กลับหน้าหลัก
    </a>
    <h1 class="text-lg font-black text-[#a855f7] italic">ZENITH.</h1>
    <div class="w-28"></div>
</nav>

<main class="max-w-3xl mx-auto pt-24 pb-20 px-6">

    <!-- Loading state -->
    <div id="loadingState" class="text-center py-20">
        <div class="inline-block w-8 h-8 border-2 border-[#a855f7] border-t-transparent rounded-full animate-spin mb-4"></div>
        <p class="text-gray-500 text-sm">กำลังโหลดข้อมูลคอร์ส...</p>
    </div>

    <!-- Course header (hidden until loaded) -->
    <div id="courseHeader" class="mb-12 fade-in hidden">
        <div id="courseBadge" class="text-[10px] font-black px-3 py-1 rounded-full uppercase w-fit border mb-4"></div>
        <h1 id="course-title" class="text-5xl font-black italic tracking-tighter mb-3"></h1>
        <p id="course-desc" class="text-gray-500 text-sm"></p>
        <div class="mt-6 bg-zinc-900 rounded-full h-2 overflow-hidden">
            <div id="progressBar" class="h-2 rounded-full transition-all duration-700" style="width:0%"></div>
        </div>
        <div class="flex items-center justify-between mt-2">
            <p class="text-[11px] text-gray-600" id="progressLabel">0% เสร็จแล้ว</p>
            <p class="text-[11px] text-gray-600" id="progressDetail"></p>
        </div>
    </div>

    <!-- Lesson list -->
    <div id="lesson-list" class="space-y-4"></div>

</main>

<script>
    const params = new URLSearchParams(window.location.search);
    const type   = params.get('course') || 'python';

    function getUnlockedLevel(courseType) {
        return parseInt(localStorage.getItem(`zenith_progress_${courseType}`) || '1');
    }

    const themeMap = {
        python:     { badge:'Python Expert', bgClass:'bg-[#2dd4bf]/10 text-[#2dd4bf] border-[#2dd4bf]/25',     desc:'จัดการงานซ้ำๆ ให้เป็นระบบอัตโนมัติขั้นสูงด้วย Python' },
        javascript: { badge:'Web Dev',       bgClass:'bg-yellow-500/10 text-yellow-400 border-yellow-500/25',   desc:'สร้างเว็บไซต์ให้มีชีวิตด้วย JavaScript ES6+' },
        react:      { badge:'Frontend',      bgClass:'bg-blue-500/10 text-blue-400 border-blue-500/25',         desc:'สร้าง Web App ระดับองค์กรด้วย React' },
        php:        { badge:'Backend Dev',   bgClass:'bg-[#777bb4]/10 text-[#777bb4] border-[#777bb4]/25',     desc:'พัฒนาฝั่ง Server และเชื่อมต่อฐานข้อมูลด้วย PHP' },
        sql:        { badge:'Data Master',   bgClass:'bg-[#00758f]/10 text-[#00758f] border-[#00758f]/25',     desc:'ออกแบบและจัดการฐานข้อมูลระดับมืออาชีพด้วย SQL' },
        html:       { badge:'UI Designer',   bgClass:'bg-[#e34f26]/10 text-[#e34f26] border-[#e34f26]/25',     desc:'สร้างโครงสร้างเว็บไซต์และดีไซน์ด้วย HTML5 & CSS3' }
    };

    const script  = document.createElement('script');
    script.src    = `assets/js/${type}_data.js`;

    script.onload = () => {
        document.getElementById('loadingState').classList.add('hidden');

        if (typeof courseData === 'undefined') {
            document.getElementById('lesson-list').innerHTML =
                '<p class="text-red-400 font-bold text-center py-10">❌ ข้อมูลไม่สมบูรณ์ในไฟล์ ' + type + '_data.js</p>';
            return;
        }

        const theme      = themeMap[type] || themeMap.python;
        const unlocked   = getUnlockedLevel(type);
        const total      = courseData.lessons.length;
        const doneLessons= Math.max(0, unlocked - 1);
        const pct        = Math.min((doneLessons / total) * 100, 100);

        // Show header
        document.getElementById('courseHeader').classList.remove('hidden');

        const badge = document.getElementById('courseBadge');
        badge.textContent = theme.badge;
        badge.className   = `text-[10px] font-black px-3 py-1 rounded-full uppercase w-fit border mb-4 ${theme.bgClass}`;

        const titleEl = document.getElementById('course-title');
        titleEl.innerText   = courseData.title;
        titleEl.style.color = courseData.themeColor;

        document.getElementById('course-desc').textContent     = theme.desc;
        document.getElementById('progressBar').style.background = courseData.themeColor;
        document.getElementById('progressBar').style.width      = pct + '%';
        document.getElementById('progressLabel').textContent    = `${Math.round(pct)}% เสร็จแล้ว`;
        document.getElementById('progressDetail').textContent   = `${doneLessons} / ${total} บท`;

        // Build lesson list
        const list = document.getElementById('lesson-list');
        list.innerHTML = '';

        courseData.lessons.forEach((lesson, idx) => {
            const isUnlocked = lesson.id <= unlocked;
            const isDone     = lesson.id < unlocked;
            const isCurrent  = lesson.id === unlocked;

            const div = document.createElement('div');
            div.className = `lesson-card p-6 flex justify-between items-center fade-in ${!isUnlocked ? 'locked' : isDone ? 'done' : ''}`;
            div.style.animationDelay = `${idx * 0.06}s`;

            div.innerHTML = `
                <div class="flex items-center gap-5 min-w-0">
                    <div class="w-10 h-10 rounded-2xl flex items-center justify-center font-black text-sm flex-shrink-0"
                         style="background:${isDone ? 'rgba(45,212,191,0.15)' : isUnlocked ? courseData.themeColor+'22' : 'rgba(255,255,255,0.04)'};
                                color:${isDone ? '#2dd4bf' : isUnlocked ? courseData.themeColor : '#555'}">
                        ${isDone ? '✓' : String(lesson.id).padStart(2,'0')}
                    </div>
                    <div class="min-w-0">
                        <div class="flex items-center gap-2 mb-0.5">
                            <h3 class="font-bold text-sm ${isUnlocked ? 'text-white' : 'text-zinc-600'} truncate">${lesson.title}</h3>
                            ${isCurrent ? '<span class="text-[8px] bg-[#a855f7]/20 text-[#a855f7] px-1.5 py-0.5 rounded font-black uppercase flex-shrink-0">ถัดไป</span>' : ''}
                        </div>
                        <p class="text-zinc-600 text-xs truncate">${lesson.desc}</p>
                    </div>
                </div>
                <div class="flex items-center gap-3 flex-shrink-0 ml-4">
                    ${!isUnlocked
                        ? `<svg class="w-4 h-4 text-zinc-700" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"/></svg>`
                        : `<a href="lesson.html?course=${type}&id=${lesson.id}">
                                <button style="background:${isDone ? 'rgba(45,212,191,0.15)' : courseData.themeColor};color:${isDone ? '#2dd4bf' : 'black'}"
                                    class="px-5 py-2 rounded-xl font-black text-[10px] uppercase tracking-widest hover:scale-105 transition-all shadow-lg whitespace-nowrap">
                                    ${isDone ? 'ทบทวน' : 'เริ่มเรียน'}
                                </button>
                           </a>`
                    }
                </div>
            `;
            list.appendChild(div);
        });
    };

    script.onerror = () => {
        document.getElementById('loadingState').classList.add('hidden');
        document.getElementById('lesson-list').innerHTML = `
            <div class="text-center py-16">
                <p class="text-4xl mb-4">❌</p>
                <p class="text-red-400 font-bold mb-2">ไม่พบไฟล์ assets/js/${type}_data.js</p>
                <p class="text-gray-600 text-sm">กรุณาตรวจสอบว่าไฟล์ถูก upload ขึ้น Vercel แล้วครับ</p>
                <a href="index.html" class="inline-block mt-6 px-6 py-2.5 bg-[#a855f7] text-white rounded-xl font-black text-xs uppercase tracking-widest">กลับหน้าหลัก</a>
            </div>`;
    };

    document.head.appendChild(script);
</script>
</body>
</html>
