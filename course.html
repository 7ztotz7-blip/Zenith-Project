<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Studio | ZENITH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #050505; color: #fff; overflow-x: hidden; }
        
        #bg-video {
            position: fixed; right: 0; bottom: 0;
            min-width: 100%; min-height: 100%;
            z-index: -2; object-fit: cover; opacity: 0.4; filter: saturate(1.2) brightness(0.7);
        }
        .video-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 30%, #050505 110%);
            z-index: -1; pointer-events: none;
        }
        .nav-blur, .sidebar-blur {
            background: rgba(5, 5, 5, 0.65); backdrop-filter: blur(20px);
            border-color: rgba(255, 255, 255, 0.05);
        }
        .glass-panel {
            background: rgba(13, 13, 14, 0.6); border: 1px solid rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px);
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #a855f7; border-radius: 10px; }
    </style>
</head>
<body>

<video autoplay loop muted playsinline id="bg-video">
    <source src="gg-video.mp4" type="video/mp4">
</video>
<div class="video-overlay"></div>

<nav class="fixed top-0 w-full z-50 h-16 flex items-center justify-between px-6 md:px-10 nav-blur border-b">
    <div class="flex items-center gap-4">
        <a href="index.html" class="text-gray-400 hover:text-white transition text-xs font-black uppercase tracking-widest flex items-center gap-2">
            ← Back
        </a>
        <span class="text-gray-600">|</span>
        <h1 id="course-title-nav" class="text-sm font-black text-[#a855f7] uppercase tracking-wider italic">Loading Course...</h1>
    </div>
    <div class="text-[10px] font-black text-gray-400 uppercase tracking-widest hidden sm:block">
        Senior Project · วิทยาลัยเทคนิคลำพูน
    </div>
</nav>

<div class="pt-16 min-h-screen flex flex-col lg:flex-row max-w-[1600px] mx-auto">
    
    <aside class="w-full lg:w-80 sidebar-blur border-b lg:border-b-0 lg:border-r flex flex-col h-auto lg:h-[calc(100vh-4rem)] lg:sticky lg:top-16">
        <div class="p-5 border-b border-white/5">
            <span id="course-badge" class="text-[8px] font-black px-2.5 py-1 rounded-full uppercase tracking-wider bg-purple-500/10 text-[#a855f7] border border-purple-500/20">Learning Path</span>
            <h2 id="course-title-sidebar" class="text-xl font-black text-white italic uppercase tracking-tighter mt-2 leading-tight">Course Title</h2>
            <p class="text-zinc-500 text-[9px] font-black mt-1 uppercase tracking-[0.15em]">ความคืบหน้าบทเรียนของคุณ</p>
        </div>
        
        <div class="flex-grow overflow-y-auto p-4 flex flex-col gap-2" id="lessons-container">
            </div>
    </aside>

    <main class="flex-grow p-6 md:p-8 flex flex-col gap-6">
        <div class="w-full aspect-video glass-panel rounded-3xl overflow-hidden relative border border-white/10 flex flex-col items-center justify-center group shadow-2xl shadow-purple-500/5">
            <div class="absolute inset-0 bg-gradient-to-tr from-purple-900/10 to-transparent pointer-events-none"></div>
            <div class="w-16 h-16 rounded-full bg-[#a855f7] text-white flex items-center justify-center text-xl font-black shadow-lg shadow-purple-500/50 group-hover:scale-110 transition-all cursor-pointer">
                ▶
            </div>
            <p id="video-placeholder-text" class="text-gray-400 text-xs font-black uppercase tracking-[0.2em] mt-4">Streaming Lesson Video...</p>
        </div>

        <div class="glass-panel rounded-3xl p-6 md:p-8">
            <h3 id="active-lesson-title" class="text-xl md:text-2xl font-black text-white italic uppercase tracking-tighter">Lesson Introduction</h3>
            <p class="text-[#2dd4bf] text-[9px] font-black uppercase tracking-widest mt-1">บทเรียนปัจจุบัน</p>
            <hr class="border-white/5 my-4">
            <p id="active-lesson-desc" class="text-zinc-400 text-xs md:text-sm leading-relaxed max-w-3xl">
                ยินดีต้อนรับเข้าสู่คอร์สเรียน ระบบกำลังโหลดเนื้อหาพื้นฐานและโปรเจกต์ตัวอย่างสำหรับวิชานี้...
            </p>
        </div>
    </main>

</div>

<script>
    // ข้อมูลเนื้อหาแบบคร่าว ๆ สำหรับเปิดโชว์อาจารย์
    const courseData = {
        python: {
            title: "Python Automation",
            icon: "🐍",
            color: "#2dd4bf",
            lessons: [
                "01 | Introduction to Python Environment",
                "02 | Variables and Dynamic Data Types",
                "03 | Control Flow and Logic Loops",
                "04 | Functions and Modular Scripting",
                "05 | Build First Automation Script Project"
            ]
        },
        javascript: {
            title: "Modern JavaScript",
            icon: "💛",
            color: "#eab308",
            lessons: [
                "01 | Core JS and DOM Manipulation",
                "02 | ES6+ Features & Arrow Functions",
                "03 | Asynchronous JS & Fetch API",
                "04 | Array Methods and Data Structure",
                "05 | Working with LocalStorage States",
                "06 | Build Dynamic Web App Project"
            ]
        },
        react: {
            title: "React Ultimate",
            icon: "⚛️",
            color: "#3b82f6",
            lessons: [
                "01 | Understanding Component Lifecycle",
                "02 | JSX Elements and Styling",
                "03 | Props and State Management",
                "04 | Handling Events and Forms",
                "05 | Deployment of React Project"
            ]
        }
    };

    function initCourse() {
        // ดึงพารามิเตอร์จาก URL เช่น ?course=python
        const urlParams = new URLSearchParams(window.location.search);
        const courseKey = urlParams.get('course') || 'python'; // ถ้าไม่มีให้ฟอลแบ็กเป็น python
        
        const data = courseData[courseKey] || courseData.python;
        
        // อัปเดตข้อความบนหน้าจอตามคอร์สที่เลือก
        document.getElementById('course-title-nav').innerText = `${data.icon} ${data.title}`;
        document.getElementById('course-title-sidebar').innerText = data.title;
        
        const container = document.getElementById('lessons-container');
        container.innerHTML = ''; // เคลียร์ของเก่า
        
        // สร้างรายชื่อบทเรียนในแถบข้าง
        data.lessons.forEach((lesson, index) => {
            const button = document.createElement('button');
            // ทำให้อันแรกเปิดมาติ๊กแอคทีฟไว้ก่อน
            const isActive = index === 0;
            
            button.className = `w-full text-left p-3 rounded-xl font-bold text-xs transition-all flex items-center justify-between ${
                isActive 
                ? 'bg-white/10 text-white border border-white/20' 
                : 'text-zinc-500 hover:bg-white/5 hover:text-zinc-300'
            }`;
            
            button.innerHTML = `
                <span class="truncate">${lesson}</span>
                <span class="text-[9px] opacity-60">${isActive ? '● Active' : '⏱️'}</span>
            `;
            
            // เพิ่มลูกเล่นเวลากดเปลี่ยนบทเรียนแบบง่าย ๆ
            button.onclick = () => {
                document.querySelectorAll('#lessons-container button').forEach(b => {
                    b.className = "w-full text-left p-3 rounded-xl font-bold text-xs transition-all flex items-center justify-between text-zinc-500 hover:bg-white/5 hover:text-zinc-300";
                });
                button.className = "w-full text-left p-3 rounded-xl font-bold text-xs transition-all flex items-center justify-between bg-white/10 text-white border border-white/20";
                
                document.getElementById('active-lesson-title').innerText = lesson;
                document.getElementById('active-lesson-desc').innerText = `เนื้อหาเจาะลึกและเวิร์กชอปของ ${lesson} กำลังเตรียมพร้อมในระบบการเรียนรู้ถัดไป...`;
            };
            
            container.appendChild(button);
        });
        
        // เซ็ตเนื้อหาแรกเข้า
        document.getElementById('active-lesson-title').innerText = data.lessons[0];
    }

    window.onload = initCourse;
</script>
</body>
</html>
