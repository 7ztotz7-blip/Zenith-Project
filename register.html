<!DOCTYPE html><html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>สมัครสมาชิก — ZENITH</title>
<meta name="robots" content="index,follow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="_shared.css"><script src="assets/js/theme.js"></script>
<style>
body {
  display:flex; align-items:center; justify-content:center;
  min-height:100vh; padding:24px;
  background-image: radial-gradient(circle, rgba(255,255,255,0.04) 1px, transparent 1px);
  background-size: 28px 28px;
}
.auth-bg {
  position:fixed; inset:0; z-index:-1;
  background:
    radial-gradient(ellipse at 80% 10%, rgba(168,85,247,0.12) 0%, transparent 50%),
    radial-gradient(ellipse at 20% 90%, rgba(77,158,255,0.08) 0%, transparent 50%),
    var(--bg);
}
.auth-orb { position:fixed; border-radius:50%; filter:blur(80px); pointer-events:none; animation:orb-drift 12s ease-in-out infinite; }
.auth-orb-1 { width:350px; height:350px; top:-80px; right:-60px; background:rgba(168,85,247,0.14); }
.auth-orb-2 { width:300px; height:300px; bottom:-60px; left:-60px; background:rgba(0,229,160,0.09); animation-delay:-6s; animation-duration:16s; }
@keyframes orb-drift { 0%,100%{transform:translate(0,0) scale(1);} 33%{transform:translate(25px,-18px) scale(1.05);} 66%{transform:translate(-18px,12px) scale(0.96);} }
.auth-wrap { width:100%; max-width:400px; position:relative; z-index:1; }
.auth-logo { display:flex; align-items:center; gap:10px; margin-bottom:28px; }
.auth-logo .logo-mark { width:36px; height:36px; border-radius:10px; font-size:15px; }
.auth-logo-name { font-size:20px; font-weight:800; letter-spacing:-.5px; }
.auth-card {
  background: rgba(13,14,20,0.75);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: var(--r4); padding: 2rem;
  -webkit-backdrop-filter: blur(24px) saturate(160%);
  backdrop-filter: blur(24px) saturate(160%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), var(--shadow), 0 0 0 1px rgba(168,85,247,0.08);
}
.auth-title {
  font-size:22px; font-weight:800; letter-spacing:-.5px; margin-bottom:4px;
  background: linear-gradient(135deg, #ffffff 30%, rgba(200,160,255,0.9));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
}
.auth-sub { font-size:13px; color:var(--text2); margin-bottom:24px; }
.field { margin-bottom:14px; }
.field-label { font-size:12px; font-weight:600; color:var(--text2); margin-bottom:6px; }
.field-input {
  width:100%; background:rgba(255,255,255,0.04); border:1px solid var(--border2);
  border-radius:var(--r); padding:10px 14px; font-size:13.5px; font-weight:500;
  color:var(--text); font-family:inherit; outline:none;
  transition:border-color .2s, box-shadow .2s;
}
.field-input::placeholder { color:var(--text3); }
.field-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-glow), inset 0 1px 0 rgba(168,85,247,0.1); background:rgba(168,85,247,0.04); }
.pw-wrap { position:relative; }
.pw-wrap .field-input { padding-right:42px; }
.pw-eye { position:absolute; right:12px; top:50%; transform:translateY(-50%); color:var(--text3); cursor:pointer; font-size:16px; transition:color .15s; }
.pw-eye:hover { color:var(--text2); }
.auth-divider { height:1px; background:var(--border); margin:20px 0; }
.auth-footer { text-align:center; font-size:13px; color:var(--text3); }
.auth-footer a { color:var(--accent); font-weight:600; }
.auth-footer a:hover { text-decoration:underline; }
.w-full { width:100%; }
.mt8 { margin-top:8px; }
.hidden { display:none!important; }
[data-theme="light"] .auth-card { background:rgba(255,255,255,0.85); border-color:rgba(0,0,0,0.08); box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,0.9); }
[data-theme="light"] .auth-title { background:linear-gradient(135deg,#0f172a 30%,#7c3aed); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
[data-theme="light"] .field-input { background:var(--bg3); }
[data-theme="light"] .field-input:focus { background:rgba(124,58,237,0.04); box-shadow:0 0 0 3px rgba(124,58,237,0.15); }
</style>
</head>
<body>
<div class="auth-bg"></div>
<div class="auth-orb auth-orb-1"></div>
<div class="auth-orb auth-orb-2"></div>
<div id="zenith-toast"></div>

<div class="auth-wrap">
  <div class="auth-logo">
    <div class="logo-mark">Z</div>
    <span class="auth-logo-name">ZENITH</span>
  </div>

  <div class="auth-card">
    <div class="auth-title">สร้างบัญชีใหม่</div>
    <div class="auth-sub">เรียนฟรี ไม่ต้องใช้บัตรเครดิต</div>

    <form id="register-form">
      <div class="field">
        <div class="field-label">Username</div>
        <input class="field-input" type="text" id="reg-username" required placeholder="ชื่อผู้ใช้งาน">
      </div>

      <div class="field">
        <div class="field-label">Email Address</div>
        <input class="field-input" type="email" id="reg-email" required placeholder="your@email.com">
      </div>

      <div class="field">
        <div class="field-label">Password</div>
        <div class="pw-wrap">
          <input class="field-input" type="password" id="reg-password" required placeholder="•••••••• (ขั้นต่ำ 6 ตัวอักษร)">
          <span class="pw-eye" onclick="togglePw('reg-password',this)">
            <i class="ti ti-eye-off eye-off"></i>
            <i class="ti ti-eye eye-on hidden"></i>
          </span>
        </div>
      </div>

      <button type="submit" id="reg-btn" class="btn btn-green btn-lg w-full mt8">
        <i class="ti ti-user-plus"></i> สมัครสมาชิก
      </button>
    </form>

    <div class="auth-divider"></div>
    <div class="auth-footer">มีบัญชีอยู่แล้ว? <a href="login.html">เข้าสู่ระบบที่นี่</a></div>
  </div>
</div>

<!-- Toast -->
<style>
#zenith-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:9999;white-space:nowrap;box-shadow:0 8px 32px rgba(0,0,0,.5)}
#zenith-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#zenith-toast.toast-ok{border-color:rgba(168,85,247,.3);color:var(--accent)}
#zenith-toast.toast-error{border-color:rgba(255,91,91,.3);color:var(--red)}
</style>

<script type="module">
import { registerUser, checkAuthState } from './assets/js/auth.js';

checkAuthState('auth_page');

function showToast(msg, isError = false) {
  const t = document.getElementById('zenith-toast');
  t.textContent = msg;
  t.className = isError ? 'show toast-error' : 'show toast-ok';
  setTimeout(() => t.className = '', 3200);
}

window.togglePw = function(id, el) {
  const input = document.getElementById(id);
  const isHidden = input.type === 'password';
  input.type = isHidden ? 'text' : 'password';
  el.querySelector('.eye-off').classList.toggle('hidden', isHidden);
  el.querySelector('.eye-on').classList.toggle('hidden', !isHidden);
};

function translateAuthError(msg) {
  if (msg.includes('email-already-in-use')) return '❌ อีเมลนี้ถูกใช้งานไปแล้ว';
  if (msg.includes('weak-password'))        return '❌ รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร';
  if (msg.includes('invalid-email'))        return '❌ รูปแบบอีเมลไม่ถูกต้อง';
  return '❌ เกิดข้อผิดพลาด กรุณาลองใหม่';
}

document.getElementById('register-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('reg-username').value.trim();
  const email    = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;
  const btn      = document.getElementById('reg-btn');
  btn.innerHTML = '<i class="ti ti-loader-2"></i> กำลังสร้างบัญชี...'; btn.disabled = true;
  const result = await registerUser(email, password, username);
  if (result.success) {
    showToast('✓ สมัครสมาชิกสำเร็จ ยินดีต้อนรับ!');
    setTimeout(() => window.location.href = 'dashboard.html', 1200);
  } else {
    showToast(translateAuthError(result.error), true);
    btn.innerHTML = '<i class="ti ti-user-plus"></i> สมัครสมาชิก'; btn.disabled = false;
  }
});
</script>
<script src="assets/js/premium.js"></script>
</body></html>
