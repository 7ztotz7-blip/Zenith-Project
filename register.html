<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith | Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="flex items-center justify-center min-h-screen px-6">

    <div class="w-full max-w-md p-8 bg-white/80 dark:bg-[#19122c]/50 border border-blue-200 dark:border-purple-950/40 backdrop-blur-xl rounded-[24px] shadow-xl">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-black text-[#0050D8] dark:text-[#a855f7] italic tracking-tighter">ZENITH.</h1>
            <p class="text-xs font-bold uppercase tracking-widest text-slate-400 dark:text-purple-400/60 mt-1">Create your account</p>
        </div>

        <form id="register-form" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Username</label>
                <input type="text" id="reg-username" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-[#0050D8] dark:bg-slate-900 dark:border-purple-950/60 dark:text-white" placeholder="ชื่อผู้ใช้งาน">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Email Address</label>
                <input type="email" id="reg-email" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-[#0050D8] dark:bg-slate-900 dark:border-purple-950/60 dark:text-white" placeholder="your@email.com">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Password</label>
                <input type="password" id="reg-password" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-[#0050D8] dark:bg-slate-900 dark:border-purple-950/60 dark:text-white" placeholder="•••••••• (ขั้นต่ำ 6 ตัวอักษร)">
            </div>
            
            <button type="submit" id="reg-btn" class="w-full bg-[#0050D8] dark:bg-[#a855f7] text-white py-3 rounded-xl text-xs font-black uppercase tracking-widest hover:opacity-90 transition-all mt-2">
                Sign Up
            </button>
        </form>

        <p class="text-center text-xs text-slate-500 dark:text-gray-400 mt-6">
            มีบัญชีอยู่แล้ว? <a href="login.html" class="text-[#0050D8] dark:text-[#a855f7] font-bold hover:underline">เข้าสู่ระบบที่นี่</a>
        </p>
    </div>

    <script type="module">
        import { registerUser, checkAuthState } from './assets/js/auth.js';

        checkAuthState('auth_page');

        function translateAuthError(errorMsg) {
            if (errorMsg.includes('email-already-in-use')) return 'อีเมลนี้ถูกใช้งานไปแล้วในระบบ';
            if (errorMsg.includes('weak-password')) return 'รหัสผ่านต้องมีความยาวอย่างน้อย 6 ตัวอักษร';
            if (errorMsg.includes('invalid-email')) return 'รูปแบบอีเมลไม่ถูกต้อง';
            return errorMsg;
        }

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('reg-username').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;
            const btn = document.getElementById('reg-btn');

            btn.innerText = "CREATING ACCOUNT...";
            btn.disabled = true;

            const result = await registerUser(email, password, username);

            if (result.success) {
                alert("สมัครสมาชิกสำเร็จ ยินดีต้อนรับครับ!");
                window.location.href = 'index.html';
            } else {
                alert("เกิดข้อผิดพลาด: " + translateAuthError(result.error));
                btn.innerText = "SIGN UP";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
