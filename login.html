<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ | ZENITH</title>
    <!-- SEO -->
    <meta name="description" content="เข้าสู่ระบบ ZENITH เพื่อเรียนโปรแกรมมิ่งออนไลน์ด้วยภาษาไทย">
    <meta name="keywords" content="เข้าสู่ระบบ, login, ZENITH">
    <meta name="author" content="ZENITH">
    <meta name="robots" content="noindex, nofollow">
    <!-- Open Graph -->
    <meta property="og:title" content="เข้าสู่ระบบ | ZENITH">
    <meta property="og:description" content="เข้าสู่ระบบ ZENITH เพื่อเรียนโปรแกรมมิ่งออนไลน์ด้วยภาษาไทย">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://zenith-alpha-lyart.vercel.app/login.html">
    <meta property="og:image" content="https://zenith-alpha-lyart.vercel.app/python-logo.png">
    <meta property="og:site_name" content="ZENITH">
    <meta property="og:locale" content="th_TH">
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="เข้าสู่ระบบ | ZENITH">
    <meta name="twitter:description" content="เข้าสู่ระบบ ZENITH เพื่อเรียนโปรแกรมมิ่งออนไลน์ด้วยภาษาไทย">
    <meta name="twitter:image" content="https://zenith-alpha-lyart.vercel.app/python-logo.png">
    <!-- Favicon -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="shortcut icon" href="favicon.svg">
    <script src="assets/js/theme.js"></script>
    <link rel="stylesheet" href="assets/css/theme-variables.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background: linear-gradient(135deg, #07040f 0%, #0d0818 100%); }
        #zenith-toast {
            position: fixed; bottom: 32px; left: 50%;
            transform: translateX(-50%) translateY(16px);
            background: #18111f; border: 1px solid rgba(168,85,247,0.3);
            color: #fff; padding: 13px 24px; border-radius: 16px;
            font-size: 13px; font-weight: 700; opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease; z-index: 9999;
            white-space: nowrap; box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            font-family: 'Kanit', sans-serif;
        }
        #zenith-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen px-6">

<button type="button" onclick="window.toggleTheme()" class="theme-toggle-btn fixed top-4 right-4 z-50" aria-label="Toggle theme">
    <svg class="icon-sun" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M18.364 18.364l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"/></svg>
    <svg class="icon-moon" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/></svg>
</button>

<div id="zenith-toast"></div>

<div class="w-full max-w-md p-8 bg-white/[0.05] border border-purple-950/50 backdrop-blur-xl rounded-[24px] shadow-2xl">
    <div class="text-center mb-6">
        <h1 class="text-3xl font-black text-[#a855f7] italic tracking-tighter">ZENITH.</h1>
        <p class="text-xs font-bold uppercase tracking-widest text-purple-400/60 mt-1">Welcome Back</p>
    </div>

    <form id="login-form" class="space-y-4">
        <div>
            <label class="block text-xs font-bold text-zinc-400 uppercase tracking-wider mb-1">Email Address</label>
            <input type="email" id="login-email" required
                class="w-full px-4 py-3 bg-white/[0.05] border border-white/10 rounded-xl text-sm text-white focus:outline-none focus:border-[#a855f7] placeholder-zinc-600 transition"
                placeholder="your@email.com">
        </div>

        <div>
            <label class="block text-xs font-bold text-zinc-400 uppercase tracking-wider mb-1">Password</label>
            <div class="relative">
                <input type="password" id="login-password" required
                    class="w-full px-4 py-3 pr-11 bg-white/[0.05] border border-white/10 rounded-xl text-sm text-white focus:outline-none focus:border-[#a855f7] placeholder-zinc-600 transition"
                    placeholder="••••••••">
                <button type="button" onclick="togglePw('login-password', this)" title="แสดง/ซ่อนรหัสผ่าน"
                    class="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-500 hover:text-zinc-300 transition">
                    <svg class="w-4 h-4 eye-closed" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                    </svg>
                    <svg class="w-4 h-4 eye-open hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                    </svg>
                </button>
            </div>
            <div class="text-right mt-1.5">
                <button type="button" onclick="toggleForgot()"
                    class="text-[11px] text-[#a855f7] hover:underline font-bold">ลืมรหัสผ่าน?</button>
            </div>
        </div>

        <!-- Forgot Password Section -->
        <div id="forgot-section" class="hidden bg-white/[0.04] border border-white/[0.07] rounded-2xl p-4">
            <p class="text-xs font-bold text-zinc-400 mb-2.5">กรอกอีเมลเพื่อรับลิงก์รีเซ็ตรหัสผ่าน</p>
            <input type="email" id="reset-email"
                class="w-full px-4 py-2.5 bg-white/[0.05] border border-white/10 rounded-xl text-sm text-white focus:outline-none focus:border-[#a855f7] placeholder-zinc-600 mb-2.5 transition"
                placeholder="your@email.com">
            <button type="button" id="reset-btn" onclick="sendReset()"
                class="w-full bg-[#a855f7]/15 border border-[#a855f7]/30 text-[#c084fc] py-2 rounded-xl text-[11px] font-black uppercase tracking-widest hover:bg-[#a855f7]/25 transition">
                ส่งอีเมลรีเซ็ต
            </button>
        </div>

        <button type="submit" id="submit-btn"
            class="w-full bg-[#a855f7] text-black py-3 rounded-xl text-xs font-black uppercase tracking-widest hover:opacity-90 active:scale-[0.98] transition-all mt-2">
            Sign In
        </button>
    </form>

    <p class="text-center text-xs text-zinc-500 mt-6">
        ยังไม่มีบัญชีสมาชิก?
        <a href="register.html" class="text-[#a855f7] font-bold hover:underline">สมัครสมาชิกใหม่ที่นี่</a>
    </p>
</div>

<script type="module">
    import { loginUser, checkAuthState } from './assets/js/auth.js';
    import { auth } from './assets/js/firebase.js';
    import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    checkAuthState('auth_page');

    function showToast(msg, isError = false) {
        const t = document.getElementById('zenith-toast');
        t.textContent = msg;
        t.style.borderColor = isError ? 'rgba(239,68,68,0.5)' : 'rgba(168,85,247,0.4)';
        t.classList.remove('show');
        void t.offsetWidth; // reflow เพื่อ restart animation
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3200);
    }

    window.togglePw = function(inputId, btn) {
        const input = document.getElementById(inputId);
        const isHidden = input.type === 'password';
        input.type = isHidden ? 'text' : 'password';
        btn.querySelector('.eye-closed').classList.toggle('hidden', isHidden);
        btn.querySelector('.eye-open').classList.toggle('hidden', !isHidden);
    };

    window.toggleForgot = function() {
        document.getElementById('forgot-section').classList.toggle('hidden');
    };

    window.sendReset = async function() {
        const email = document.getElementById('reset-email').value.trim();
        if (!email) { showToast('กรุณากรอกอีเมล', true); return; }
        const btn = document.getElementById('reset-btn');
        btn.textContent = 'กำลังส่ง...'; btn.disabled = true;
        try {
            await sendPasswordResetEmail(auth, email);
            showToast('✓ ส่งอีเมลรีเซ็ตแล้ว ตรวจสอบกล่องจดหมายของคุณ');
            document.getElementById('forgot-section').classList.add('hidden');
            document.getElementById('reset-email').value = '';
        } catch (_) {
            showToast('ไม่พบอีเมลนี้ในระบบ', true);
        }
        btn.textContent = 'ส่งอีเมลรีเซ็ต'; btn.disabled = false;
    };

    function translateLoginError(msg) {
        if (msg.includes('invalid-credential') || msg.includes('user-not-found') || msg.includes('wrong-password'))
            return '❌ อีเมลหรือรหัสผ่านไม่ถูกต้อง';
        if (msg.includes('too-many-requests'))
            return '⏳ ลองผิดบ่อยเกินไป กรุณารอสักครู่แล้วลองใหม่';
        return '❌ เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง';
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email    = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;
        const btn      = document.getElementById('submit-btn');
        btn.innerText = 'AUTHENTICATING...'; btn.disabled = true;
        const result = await loginUser(email, password);
        if (result.success) {
            window.location.href = 'index.html';
        } else {
            showToast(translateLoginError(result.error), true);
            btn.innerText = 'SIGN IN'; btn.disabled = false;
        }
    });
</script>
</body>
</html>
