<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith | Secure Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; }
        .glass-panel {
            background: rgba(10, 10, 12, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .input-glow:focus {
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
            border-color: #a855f7;
        }
    </style>
</head>
<body class="bg-[#050505] h-screen flex items-center justify-center p-4">

    <video autoplay muted loop playsinline class="fixed inset-0 w-full h-full object-cover z-[-1] opacity-40">
        <source src="gg-video.mp4" type="video/mp4">
    </video>

    <div class="glass-panel w-full max-w-[420px] p-10 rounded-[40px] shadow-2xl">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-black text-white italic tracking-tighter mb-2">ZENITH<span class="text-[#a855f7]">.</span></h1>
            <p class="text-zinc-500 text-[11px] font-bold uppercase tracking-[0.3em]">Welcome Back, Explorer</p>
        </div>

        <div class="space-y-6">
            <div>
                <label class="text-[10px] text-zinc-400 font-bold uppercase tracking-widest ml-1 mb-2 block">Username</label>
                <input type="text" id="userNameInput" placeholder="Enter your ID" 
                    class="input-glow w-full bg-white/5 border border-white/10 rounded-2xl p-4 text-white text-sm outline-none transition-all placeholder:text-white/20">
            </div>

            <div>
                <label class="text-[10px] text-zinc-400 font-bold uppercase tracking-widest ml-1 mb-2 block">Password</label>
                <input type="password" id="passwordInput" placeholder="••••••••" 
                    class="input-glow w-full bg-white/5 border border-white/10 rounded-2xl p-4 text-white text-sm outline-none transition-all placeholder:text-white/20">
            </div>

            <button onclick="saveUser()" 
                class="w-full bg-[#a855f7] hover:bg-purple-600 active:scale-[0.98] text-white font-black py-4 rounded-2xl transition-all shadow-[0_4px_20px_rgba(168,85,247,0.3)] uppercase text-[12px] tracking-[0.2em] mt-4">
                Sign In
            </button>
        </div>

        <p class="text-center text-[10px] text-zinc-600 mt-8 font-bold uppercase tracking-widest">
            Don't have access? <a href="register.html" class="text-white hover:text-[#a855f7] transition-colors underline">Register</a>
        </p>
    </div>

    <script>
        function saveUser() {
            const name = document.getElementById('userNameInput').value.trim();
            const pass = document.getElementById('passwordInput').value.trim();
            
            if (name !== "") {
                // บันทึก key เป็น zenith_user ตามที่หน้า index.html ต้องการ
                localStorage.setItem('zenith_user', name);
                
                // เอฟเฟกต์เล็กน้อยก่อนเปลี่ยนหน้า
                event.target.innerText = "Authenticating...";
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 500);
            } else {
                alert('Please enter your username');
            }
        }
    </script>
</body>
</html>
