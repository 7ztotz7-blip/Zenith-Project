<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="flex items-center justify-center min-h-screen px-6">

    <div class="w-full max-w-md p-8 bg-white/80 dark:bg-[#19122c]/50 border border-blue-200 dark:border-purple-950/40 backdrop-blur-xl rounded-[24px] shadow-xl">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-black text-[#0050D8] dark:text-[#a855f7] italic tracking-tighter">ZENITH.</h1>
            <p class="text-xs font-bold uppercase tracking-widest text-slate-400 dark:text-purple-400/60 mt-1">Welcome Back</p>
        </div>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Email Address</label>
                <input type="email" id="login-email" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-[#0050D8] dark:bg-slate-900 dark:border-purple-950/60 dark:text-white" placeholder="your@email.com">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Password</label>
                <input type="password" id="login-password" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-[#0050D8] dark:bg-slate-900 dark:border-purple-950/60 dark:text-white" placeholder="••••••••">
            </div>
            
            <button type="submit" id="submit-btn" class="w-full bg-[#0050D8] dark:bg-[#a855f7] text-white py-3 rounded-xl text-xs font-black uppercase tracking-widest hover:opacity-90 transition-all mt-2">
                Sign In
            </button>
        </form>

        <p class="text-center text-xs text-slate-500 dark:text-gray-400 mt-6">
            ยังไม่มีบัญชีสมาชิก? <a href="register.html" class="text-[#0050D8] dark:text-[#a855f7] font-bold hover:underline">สมัครสมาชิกใหม่ที่นี่</a>
        </p>
    </div>

    <script type="module">
        import { loginUser, checkAuthState } from './assets/js/auth.js';

        checkAuthState('auth_page');

        function translateLoginError(errorMsg) {
            if (errorMsg.includes('invalid-credential') || errorMsg.includes('user-not-found') || errorMsg.includes('wrong-password')) {
                return 'อีเมลหรือรหัสผ่านไม่ถูกต้อง โปรดตรวจสอบอีกครั้ง';
            }
            if (errorMsg.includes('too-many-requests')) {
                return 'บัญชีนี้ถูกระงับชั่วคราวเนื่องจากลองรหัสผ่านผิดมากเกินไป ลองใหม่อีกครั้งภายหลัง';
            }
            return errorMsg;
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('submit-btn');

            btn.innerText = "AUTHENTICATING...";
            btn.disabled = true;

            const result = await loginUser(email, password);

            if (result.success) {
                window.location.href = 'index.html';
            } else {
                alert(translateLoginError(result.error));
                btn.innerText = "SIGN IN";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
