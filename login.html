<!DOCTYPE html><html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>เข้าสู่ระบบ — ZENITH</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="_shared.css"><script src="assets/js/theme.js"></script>
<style>
body {
  display:flex; align-items:center; justify-content:center;
  min-height:100vh; padding:24px;
  /* Dot grid */
  background-image: radial-gradient(circle, rgba(255,255,255,0.04) 1px, transparent 1px);
  background-size: 28px 28px;
}

/* Mesh gradient ambient background */
.auth-bg {
  position:fixed; inset:0; z-index:-1;
  background:
    radial-gradient(ellipse at 20% 10%, rgba(168,85,247,0.12) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 90%, rgba(77,158,255,0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(0,229,160,0.04) 0%, transparent 60%),
    var(--bg);
}

/* Gradient orbs */
.auth-orb {
  position:fixed; border-radius:50%; filter:blur(80px); pointer-events:none;
  animation: orb-drift 12s ease-in-out infinite;
}
.auth-orb-1 { width:400px; height:400px; top:-100px; left:-100px; background:rgba(168,85,247,0.14); }
.auth-orb-2 { width:350px; height:350px; bottom:-80px; right:-80px; background:rgba(77,158,255,0.10); animation-delay:-5s; animation-duration:15s; }
@keyframes orb-drift {
  0%,100% { transform:translate(0,0) scale(1); }
  33%      { transform:translate(30px,-20px) scale(1.05); }
  66%      { transform:translate(-20px,15px) scale(0.96); }
}

.auth-wrap { width:100%; max-width:400px; position:relative; z-index:1; }
.auth-logo { display:flex; align-items:center; gap:10px; margin-bottom:28px; }
.auth-logo .logo-mark { width:36px; height:36px; border-radius:10px; font-size:15px; }
.auth-logo-name { font-size:20px; font-weight:800; letter-spacing:-.5px; }

/* Glassmorphism card */
.auth-card {
  background: rgba(13,14,20,0.75);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: var(--r4);
  padding: 2rem;
  -webkit-backdrop-filter: blur(24px) saturate(160%);
  backdrop-filter: blur(24px) saturate(160%);
  box-shadow:
    0 1px 0 rgba(255,255,255,0.06) inset,
    var(--shadow),
    0 0 0 1px rgba(168,85,247,0.08);
}

.auth-title {
  font-size:22px; font-weight:800; letter-spacing:-.5px; margin-bottom:4px;
  background: linear-gradient(135deg, #ffffff 30%, rgba(200,160,255,0.9));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.auth-sub { font-size:13px; color:var(--text2); margin-bottom:24px; }
.field { margin-bottom:14px; }
.field-label { font-size:12px; font-weight:600; color:var(--text2); margin-bottom:6px; }
.field-input {
  width:100%; background:rgba(255,255,255,0.04); border:1px solid var(--border2);
  border-radius:var(--r); padding:10px 14px; font-size:13.5px; font-weight:500;
  color:var(--text); font-family:inherit; outline:none;
  transition:border-color .2s, box-shadow .2s;
}
.field-input::placeholder { color:var(--text3); }
.field-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow), inset 0 1px 0 rgba(168,85,247,0.1);
  background: rgba(168,85,247,0.04);
}
.pw-wrap { position:relative; }
.pw-wrap .field-input { padding-right:42px; }
.pw-eye { position:absolute; right:12px; top:50%; transform:translateY(-50%); color:var(--text3); cursor:pointer; font-size:16px; transition:color .15s; }
.pw-eye:hover { color:var(--text2); }
.field-hint { text-align:right; margin-top:5px; }
.forgot-link { font-size:12px; font-weight:600; color:var(--accent); cursor:pointer; background:none; border:none; font-family:inherit; }
.forgot-link:hover { text-decoration:underline; }
.forgot-box { background:rgba(255,255,255,0.03); border:1px solid var(--border2); border-radius:var(--r); padding:14px; margin-bottom:14px; }
.forgot-hint { font-size:12px; color:var(--text2); margin-bottom:10px; }
.auth-divider { height:1px; background:var(--border); margin:20px 0; }
.auth-footer { text-align:center; font-size:13px; color:var(--text3); }
.auth-footer a { color:var(--accent); font-weight:600; }
.auth-footer a:hover { text-decoration:underline; }
.mb10 { margin-bottom:10px; }
.mt8  { margin-top:8px; }

[data-theme="light"] .auth-card {
  background: rgba(255,255,255,0.85);
  border-color: rgba(0,0,0,0.08);
  box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.9);
}
[data-theme="light"] .auth-title { background: linear-gradient(135deg, #0f172a 30%, #7c3aed); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
[data-theme="light"] .field-input { background:var(--bg3); }
[data-theme="light"] .field-input:focus { background:rgba(124,58,237,0.04); box-shadow:0 0 0 3px rgba(124,58,237,0.15); }
[data-theme="light"] .auth-orb-1 { background:rgba(124,58,237,0.08); }
[data-theme="light"] .auth-orb-2 { background:rgba(29,78,216,0.06); }
</style>
</head>
<body>
<div class="auth-bg"></div>
<div class="auth-orb auth-orb-1"></div>
<div class="auth-orb auth-orb-2"></div>
<div id="zenith-toast"></div>

<div class="auth-wrap">
  <div class="auth-logo">
    <div class="logo-mark">Z</div>
    <span class="auth-logo-name">ZENITH</span>
  </div>

  <div class="auth-card">
    <div class="auth-title">ยินดีต้อนรับกลับ</div>
    <div class="auth-sub">เข้าสู่ระบบเพื่อเรียนต่อจากที่ค้างไว้</div>

    <form id="login-form">
      <div class="field">
        <div class="field-label">Email Address</div>
        <input class="field-input" type="email" id="login-email" required placeholder="your@email.com">
      </div>

      <div class="field">
        <div class="field-label">Password</div>
        <div class="pw-wrap">
          <input class="field-input" type="password" id="login-password" required placeholder="••••••••">
          <span class="pw-eye" onclick="togglePw('login-password',this)">
            <i class="ti ti-eye-off eye-off"></i>
            <i class="ti ti-eye eye-on hidden"></i>
          </span>
        </div>
        <div class="field-hint">
          <button type="button" class="forgot-link" onclick="toggleForgot()">ลืมรหัสผ่าน?</button>
        </div>
      </div>

      <div id="forgot-section" class="forgot-box hidden">
        <div class="forgot-hint">กรอกอีเมลเพื่อรับลิงก์รีเซ็ตรหัสผ่าน</div>
        <input class="field-input mb10" type="email" id="reset-email" placeholder="your@email.com">
        <button type="button" id="reset-btn" class="btn btn-ghost btn-sm w-full" onclick="sendReset()">
          <i class="ti ti-send"></i> ส่งอีเมลรีเซ็ต
        </button>
      </div>

      <button type="submit" id="submit-btn" class="btn btn-green btn-lg w-full mt8">
        <i class="ti ti-login"></i> Sign In
      </button>
    </form>

    <div class="auth-divider"></div>
    <div class="auth-footer">ยังไม่มีบัญชี? <a href="register.html">สมัครสมาชิกฟรี</a></div>
  </div>
</div>

<!-- Toast -->
<style>
#zenith-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:9999;white-space:nowrap;box-shadow:0 8px 32px rgba(0,0,0,.5)}
#zenith-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#zenith-toast.toast-ok{border-color:rgba(168,85,247,.3);color:var(--accent)}
#zenith-toast.toast-error{border-color:rgba(255,91,91,.3);color:var(--red)}
.hidden{display:none!important}
.w-full{width:100%}
</style>

<script type="module">
import { loginUser, checkAuthState } from './assets/js/auth.js';
import { auth } from './assets/js/firebase.js';
import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

checkAuthState('auth_page');

function showToast(msg, isError = false) {
  const t = document.getElementById('zenith-toast');
  t.textContent = msg;
  t.className = isError ? 'show toast-error' : 'show toast-ok';
  setTimeout(() => t.className = '', 3200);
}

window.togglePw = function(id, el) {
  const input = document.getElementById(id);
  const isHidden = input.type === 'password';
  input.type = isHidden ? 'text' : 'password';
  el.querySelector('.eye-off').classList.toggle('hidden', isHidden);
  el.querySelector('.eye-on').classList.toggle('hidden', !isHidden);
};

window.toggleForgot = function() {
  document.getElementById('forgot-section').classList.toggle('hidden');
};

window.sendReset = async function() {
  const email = document.getElementById('reset-email').value.trim();
  if (!email) { showToast('กรุณากรอกอีเมล', true); return; }
  const btn = document.getElementById('reset-btn');
  btn.textContent = 'กำลังส่ง...'; btn.disabled = true;
  try {
    await sendPasswordResetEmail(auth, email);
    showToast('✓ ส่งอีเมลรีเซ็ตแล้ว ตรวจสอบกล่องจดหมาย');
    document.getElementById('forgot-section').classList.add('hidden');
    document.getElementById('reset-email').value = '';
  } catch (_) {
    showToast('ไม่พบอีเมลนี้ในระบบ', true);
  }
  btn.textContent = 'ส่งอีเมลรีเซ็ต'; btn.disabled = false;
};

function translateLoginError(msg) {
  if (msg.includes('invalid-credential') || msg.includes('user-not-found') || msg.includes('wrong-password'))
    return '❌ อีเมลหรือรหัสผ่านไม่ถูกต้อง';
  if (msg.includes('too-many-requests'))
    return '⏳ ลองผิดบ่อยเกินไป กรุณารอสักครู่';
  return '❌ เกิดข้อผิดพลาด กรุณาลองใหม่';
}

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email    = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const btn      = document.getElementById('submit-btn');
  btn.innerHTML = '<i class="ti ti-loader-2"></i> กำลังเข้าสู่ระบบ...'; btn.disabled = true;
  const result = await loginUser(email, password);
  if (result.success) {
    window.location.href = 'dashboard.html';
  } else {
    showToast(translateLoginError(result.error), true);
    btn.innerHTML = '<i class="ti ti-login"></i> Sign In'; btn.disabled = false;
  }
});
</script>
<script src="assets/js/premium.js"></script>
</body></html>
