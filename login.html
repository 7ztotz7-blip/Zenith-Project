<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Zenith</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; overflow: hidden; }
        
        /* สไตล์สำหรับวิดีโอพื้นหลัง */
        #video-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -100;
            transform: translateX(-50%) translateY(-50%);
            object-fit: cover;
            filter: brightness(0.4); /* ปรับให้วิดีโอมืดลงเล็กน้อยเพื่อให้ตัวหนังสือชัดขึ้น */
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes fadeIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
        .fade-in { animation: fadeIn 0.8s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-black">

    <!-- วิดีโอพื้นหลัง -->
    <video autoplay muted loop playsinline id="video-bg">
        <source src="gg-video.mp4" type="video/mp4">
    </video>

    <!-- แทนที่ส่วน Glass Login Card ใน login.html -->
<div class="relative w-[400px] p-10 rounded-[32px] glass-card shadow-2xl fade-in overflow-hidden" 
     style="background: rgba(0, 0, 0, 0.45); border: 1px solid rgba(255, 255, 255, 0.1);">
    
    <div class="text-center mb-10">
        <h1 class="text-3xl font-black text-[#a855f7] italic tracking-tighter mb-2 drop-shadow-lg">ZENITH.</h1>
        <h2 class="text-xl font-bold text-white uppercase tracking-[0.4em]">Login</h2>
    </div>

    <form id="loginForm" class="space-y-8">
        <!-- Username Field -->
        <div class="relative group">
            <label class="text-[11px] text-cyan-400 font-black uppercase tracking-[0.2em] ml-1">Username</label>
            <div class="flex items-center border-b-2 border-white/30 py-3 group-focus-within:border-cyan-400 transition-all duration-300">
                <span class="text-white mr-4">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                </span>
                <input type="text" id="userNameInput" placeholder="กรอกชื่อของคุณ..."
                       class="bg-transparent border-none w-full text-white font-semibold placeholder:text-white/40 focus:outline-none text-sm tracking-wide">
            </div>
        </div>

        <!-- Password Field -->
        <div class="relative group">
            <label class="text-[11px] text-white/70 font-black uppercase tracking-[0.2em] ml-1">Password</label>
            <div class="flex items-center border-b-2 border-white/30 py-3 group-focus-within:border-[#a855f7] transition-all duration-300">
                <span class="text-white mr-4">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                </span>
                <input type="password" placeholder="••••••••"
                       class="bg-transparent border-none w-full text-white font-semibold placeholder:text-white/40 focus:outline-none text-sm">
            </div>
        </div>

        <!-- Submit Button -->
        <button type="button" onclick="saveUser()"
                class="w-full bg-[#a855f7] hover:bg-[#9333ea] text-white font-black py-4 rounded-2xl shadow-[0_0_20px_rgba(168,85,247,0.4)] transition-all active:scale-95 uppercase text-xs tracking-[0.3em] mt-6">
            Sign In
        </button>
    </form>

    <p class="text-center text-[12px] text-white/80 mt-10 font-medium">
        ยังไม่มีบัญชี? <a href="register.html" class="text-cyan-400 font-black hover:text-cyan-300 transition-colors underline decoration-cyan-400/30">ลงทะเบียนที่นี่</a>
    </p>
</div>

    <!-- เชื่อมต่อระบบสมาชิก -->
    <script src="assets/js/auth.js"></script>

    <script>
    function saveUser() {
        const nameInput = document.getElementById('userNameInput').value;
        if (nameInput.trim() !== "") {
            // บันทึกชื่อลงในเครื่อง
            localStorage.setItem('zenith_user_name', nameInput);
            // ส่งไปหน้าแรก
            window.location.href = 'index.html';
        } else {
            alert('กรุณากรอกชื่อผู้ใช้งานก่อนครับ');
        }
    }
</script>
</body>
</html>
